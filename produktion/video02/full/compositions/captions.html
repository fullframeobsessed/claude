  <div id="root" data-composition-id="captions" data-width="1920" data-height="1080" data-layout-allow-caption-zone><div id="k0" class="clip cap" data-start="2.950" data-duration="1.260">Das ist Otto.</div><div id="k1" class="clip cap" data-start="4.330" data-duration="2.840">Otto hatte für diese Präsentation drei Wochen</div><div id="k2" class="clip cap" data-start="7.190" data-duration="0.700">Zeit.</div><div id="k3" class="clip cap" data-start="8.030" data-duration="1.820">Gemacht hat er sie in den letzten</div><div id="k4" class="clip cap" data-start="9.870" data-duration="1.060">drei Stunden.</div><div id="k5" class="clip cap" data-start="11.050" data-duration="1.100">Und das Verrückte:</div><div id="k6" class="clip cap" data-start="12.250" data-duration="1.720">Sie ist richtig gut geworden.</div><div id="k7" class="clip cap" data-start="14.250" data-duration="1.760">Ist Otto heimlich ein Genie,</div><div id="k8" class="clip cap" data-start="16.030" data-duration="1.860">das einfach nur Druck braucht?</div><div id="k9" class="clip cap" data-start="18.090" data-duration="1.900">Oder spielt ihm sein Gehirn hier einen</div><div id="k10" class="clip cap" data-start="20.010" data-duration="0.820">Streich?</div><div id="k11" class="clip cap" data-start="21.050" data-duration="0.940">Kurze Frage an dich,</div><div id="k12" class="clip cap" data-start="22.010" data-duration="0.740">bevor wir anfangen:</div><div id="k13" class="clip cap" data-start="22.770" data-duration="3.220">Wann hast du deine letzte große Aufgabe</div><div id="k14" class="clip cap" data-start="26.010" data-duration="0.920">erledigt?</div><div id="k15" class="clip cap" data-start="27.050" data-duration="0.520">A:</div><div id="k16" class="clip cap" data-start="27.850" data-duration="0.460">früh.</div><div id="k17" class="clip cap" data-start="28.570" data-duration="0.480">B:</div><div id="k18" class="clip cap" data-start="29.330" data-duration="0.700">pünktlich.</div><div id="k19" class="clip cap" data-start="30.050" data-duration="0.920">Oder C:</div><div id="k20" class="clip cap" data-start="31.350" data-duration="1.060">in letzter Minute?</div><div id="k21" class="clip cap" data-start="32.590" data-duration="1.260">Merk dir deine Antwort.</div><div id="k22" class="clip cap" data-start="34.230" data-duration="1.640">Wir lösen das am Ende auf.</div><div id="k23" class="clip cap" data-start="41.410" data-duration="3.980">1955 schrieb der britische Historiker Cyril Northcote</div><div id="k24" class="clip cap" data-start="45.410" data-duration="1.420">Parkinson einen Satz,</div><div id="k25" class="clip cap" data-start="46.850" data-duration="2.180">der seitdem berühmt ist:</div><div id="k26" class="clip cap" data-start="49.130" data-duration="2.700">Arbeit dehnt sich genau so weit aus,</div><div id="k27" class="clip cap" data-start="52.090" data-duration="2.280">wie Zeit für sie zur Verfügung steht.</div><div id="k28" class="clip cap" data-start="54.530" data-duration="1.640">Hat Otto drei Wochen Zeit,</div><div id="k29" class="clip cap" data-start="56.410" data-duration="2.180">braucht die Präsentation drei Wochen.</div><div id="k30" class="clip cap" data-start="58.790" data-duration="1.160">Hat er drei Stunden,</div><div id="k31" class="clip cap" data-start="60.190" data-duration="1.500">braucht sie drei Stunden.</div><div id="k32" class="clip cap" data-start="61.870" data-duration="1.400">Das Problem ist nicht,</div><div id="k33" class="clip cap" data-start="63.290" data-duration="1.740">dass Otto zu wenig Zeit hat.</div><div id="k34" class="clip cap" data-start="65.250" data-duration="1.280">Das Problem ist,</div><div id="k35" class="clip cap" data-start="66.710" data-duration="2.400">dass sich zu viel Zeit nach gar</div><div id="k36" class="clip cap" data-start="69.130" data-duration="1.140">nichts anfühlt.</div><div id="k37" class="clip cap" data-start="70.350" data-duration="1.860">Drei Wochen sind für dein Gehirn ein</div><div id="k38" class="clip cap" data-start="72.230" data-duration="1.660">unendlich weiter Horizont.</div><div id="k39" class="clip cap" data-start="73.910" data-duration="1.200">Freitag,</div><div id="k40" class="clip cap" data-start="75.130" data-duration="3.580">23:58 Uhr ist dagegen sehr,</div><div id="k41" class="clip cap" data-start="78.830" data-duration="1.340">sehr konkret.</div><div id="k42" class="clip cap" data-start="82.485" data-duration="2.165">Erinnerst du dich an die Alarmanlage aus</div><div id="k43" class="clip cap" data-start="84.670" data-duration="1.120">der letzten Folge?</div><div id="k44" class="clip cap" data-start="86.050" data-duration="0.960">Die Amygdala?</div><div id="k45" class="clip cap" data-start="87.190" data-duration="2.160">Solange die Deadline weit weg ist,</div><div id="k46" class="clip cap" data-start="89.450" data-duration="1.840">schlägt sie Alarm bei der Aufgabe.</div><div id="k47" class="clip cap" data-start="91.630" data-duration="1.720">Je näher die Deadline rückt,</div><div id="k48" class="clip cap" data-start="93.510" data-duration="1.980">desto mehr dreht sich das um:</div><div id="k49" class="clip cap" data-start="95.630" data-duration="1.640">Jetzt ist das Nicht-Machen</div><div id="k50" class="clip cap" data-start="97.530" data-duration="0.920">das größere Übel.</div><div id="k51" class="clip cap" data-start="98.470" data-duration="3.520">Dein Körper schüttet Stresshormone wie Noradrenalin</div><div id="k52" class="clip cap" data-start="102.190" data-duration="0.680">aus.</div><div id="k53" class="clip cap" data-start="103.090" data-duration="1.280">Der Puls steigt,</div><div id="k54" class="clip cap" data-start="104.470" data-duration="1.300">der Fokus wird enger,</div><div id="k55" class="clip cap" data-start="105.990" data-duration="1.520">Ablenkungen verschwinden.</div><div id="k56" class="clip cap" data-start="107.630" data-duration="2.280">Psychologen beschreiben das seit über hundert Jahren</div><div id="k57" class="clip cap" data-start="109.930" data-duration="1.240">mit einer Kurve:</div><div id="k58" class="clip cap" data-start="111.450" data-duration="3.120">Mit etwas Anspannung steigt die Leistung.</div><div id="k59" class="clip cap" data-start="114.590" data-duration="1.740">Aber nur bis zu einem Punkt.</div><div id="k60" class="clip cap" data-start="116.570" data-duration="1.100">Danach kippt sie.</div><div id="k61" class="clip cap" data-start="117.730" data-duration="1.960">Otto lebt auf dem steilen Teil dieser</div><div id="k62" class="clip cap" data-start="119.710" data-duration="0.480">Kurve.</div><div id="k63" class="clip cap" data-start="120.210" data-duration="2.840">Und manchmal fällt er auf der anderen</div><div id="k64" class="clip cap" data-start="123.070" data-duration="1.280">Seite wieder runter.</div><div id="k65" class="clip cap" data-start="126.534" data-duration="1.336">Also stimmt es doch:</div><div id="k66" class="clip cap" data-start="128.090" data-duration="2.040">Unter Druck arbeiten wir besser?</div><div id="k67" class="clip cap" data-start="130.270" data-duration="0.820">Nicht ganz.</div><div id="k68" class="clip cap" data-start="131.370" data-duration="3.140">Die Psychologen Dianne Tice und Roy Baumeister</div><div id="k69" class="clip cap" data-start="134.530" data-duration="3.680">haben Studierende ein ganzes Semester lang begleitet.</div><div id="k70" class="clip cap" data-start="138.430" data-duration="2.440">Die Aufschieber waren am Anfang entspannter als</div><div id="k71" class="clip cap" data-start="140.890" data-duration="0.980">alle anderen.</div><div id="k72" class="clip cap" data-start="142.150" data-duration="2.200">Doch gegen Ende hatten sie mehr Stress,</div><div id="k73" class="clip cap" data-start="144.630" data-duration="2.820">mehr Krankheitssymptome und schlechtere Noten.</div><div id="k74" class="clip cap" data-start="147.470" data-duration="2.720">Das Genie-Gefühl ist ein Gedächtnistrick.</div><div id="k75" class="clip cap" data-start="150.570" data-duration="1.620">Wir erinnern uns an die eine Nacht,</div><div id="k76" class="clip cap" data-start="152.210" data-duration="0.960">in der es geklappt hat.</div><div id="k77" class="clip cap" data-start="153.190" data-duration="1.620">Und vergessen die drei,</div><div id="k78" class="clip cap" data-start="154.830" data-duration="1.140">in denen es knapp,</div><div id="k79" class="clip cap" data-start="156.170" data-duration="3.060">peinlich oder einfach nur mittelmäßig wurde.</div><div id="k80" class="clip cap" data-start="159.350" data-duration="1.880">Pausier mal kurz und sei ehrlich:</div><div id="k81" class="clip cap" data-start="161.550" data-duration="1.340">Wie oft hat es bei dir wirklich</div><div id="k82" class="clip cap" data-start="162.910" data-duration="0.920">geklappt?</div><div id="k83" class="clip cap" data-start="167.366" data-duration="1.364">Die gute Nachricht:</div><div id="k84" class="clip cap" data-start="168.950" data-duration="1.460">Den Turbo kannst du nutzen,</div><div id="k85" class="clip cap" data-start="170.430" data-duration="1.700">ohne bis Freitagnacht zu warten.</div><div id="k86" class="clip cap" data-start="172.150" data-duration="2.440">Dan Ariely und Klaus Wertenbroch</div><div id="k87" class="clip cap" data-start="174.690" data-duration="1.600">haben das getestet.</div><div id="k88" class="clip cap" data-start="176.350" data-duration="2.520">Studierende sollten drei Arbeiten schreiben.</div><div id="k89" class="clip cap" data-start="179.170" data-duration="1.280">Eine Gruppe hatte feste,</div><div id="k90" class="clip cap" data-start="180.470" data-duration="2.380">gleichmäßig verteilte Abgabetermine.</div><div id="k91" class="clip cap" data-start="182.950" data-duration="2.220">Eine durfte sich ihre Termine selbst setzen.</div><div id="k92" class="clip cap" data-start="185.190" data-duration="2.440">Und eine hatte nur einen Termin,</div><div id="k93" class="clip cap" data-start="187.650" data-duration="1.180">ganz am Ende.</div><div id="k94" class="clip cap" data-start="188.970" data-duration="0.780">Das Ergebnis:</div><div id="k95" class="clip cap" data-start="190.090" data-duration="2.900">Die festen Zwischentermine schnitten am besten ab,</div><div id="k96" class="clip cap" data-start="193.070" data-duration="1.760">die Gruppe mit nur einem Termin am</div><div id="k97" class="clip cap" data-start="194.850" data-duration="0.960">schlechtesten.</div><div id="k98" class="clip cap" data-start="195.890" data-duration="0.340">Also:</div><div id="k99" class="clip cap" data-start="196.250" data-duration="2.000">Hol dir die Deadline nach vorne.</div><div id="k100" class="clip cap" data-start="198.270" data-duration="1.520">Hack Nummer eins:</div><div id="k101" class="clip cap" data-start="200.150" data-duration="0.700">Zwischen-Deadlines.</div><div id="k102" class="clip cap" data-start="200.870" data-duration="3.060">Teil die große Aufgabe in kleine Stücke,</div><div id="k103" class="clip cap" data-start="203.950" data-duration="2.640">und jedes Stück bekommt ein eigenes Datum.</div><div id="k104" class="clip cap" data-start="206.610" data-duration="1.460">Hack Nummer zwei:</div><div id="k105" class="clip cap" data-start="208.170" data-duration="1.080">Mach sie öffentlich.</div><div id="k106" class="clip cap" data-start="209.530" data-duration="1.080">Sag jemandem,</div><div id="k107" class="clip cap" data-start="210.630" data-duration="1.620">bis wann du fertig bist.</div><div id="k108" class="clip cap" data-start="212.330" data-duration="1.740">Plötzlich ist die Deadline echt.</div><div id="k109" class="clip cap" data-start="214.090" data-duration="1.600">Hack Nummer drei:</div><div id="k110" class="clip cap" data-start="215.830" data-duration="1.110">der Mini-Countdown.</div><div id="k111" class="clip cap" data-start="217.370" data-duration="2.160">Stell dir einen Timer auf 25 Minuten</div><div id="k112" class="clip cap" data-start="219.550" data-duration="1.600">und tu so,</div><div id="k113" class="clip cap" data-start="221.190" data-duration="1.200">als wäre es Freitag,</div><div id="k114" class="clip cap" data-start="222.410" data-duration="1.320">23:35 Uhr.</div><div id="k115" class="clip cap" data-start="223.750" data-duration="2.300">Hack Nummer vier:</div><div id="k116" class="clip cap" data-start="226.290" data-duration="1.140">der Wenn-dann-Plan.</div><div id="k117" class="clip cap" data-start="227.930" data-duration="0.200">Nicht:</div><div id="k118" class="clip cap" data-start="228.150" data-duration="1.740">„Ich mach das diese Woche.“</div><div id="k119" class="clip cap" data-start="230.070" data-duration="0.240">Sondern:</div><div id="k120" class="clip cap" data-start="230.330" data-duration="2.600">„Wenn es Dienstag 18 Uhr ist,</div><div id="k121" class="clip cap" data-start="232.950" data-duration="1.600">dann öffne ich die Datei.“</div><div id="k122" class="clip cap" data-start="234.590" data-duration="2.460">Der Psychologe Peter Gollwitzer hat gezeigt,</div><div id="k123" class="clip cap" data-start="237.270" data-duration="2.640">dass solche Pläne die Chance deutlich erhöhen,</div><div id="k124" class="clip cap" data-start="239.930" data-duration="1.419">dass wir wirklich anfangen.</div><div id="k125" class="clip cap" data-start="241.369" data-duration="1.601">Otto hat es ausprobiert.</div><div id="k126" class="clip cap" data-start="243.290" data-duration="2.080">Mittwochabend war die Präsentation fertig.</div><div id="k127" class="clip cap" data-start="245.390" data-duration="2.250">Und Freitag um 23:58</div><div id="k128" class="clip cap" data-start="247.910" data-duration="1.100">Uhr?</div><div id="k129" class="clip cap" data-start="249.030" data-duration="0.920">Hat Otto geschlafen.</div><div id="k130" class="clip cap" data-start="249.970" data-duration="1.100">Und du?</div><div id="k131" class="clip cap" data-start="251.110" data-duration="1.960">Was war deine Antwort am Anfang:</div><div id="k132" class="clip cap" data-start="253.190" data-duration="0.560">A,</div><div id="k133" class="clip cap" data-start="253.930" data-duration="1.240">B oder C?</div><div id="k134" class="clip cap" data-start="255.250" data-duration="1.260">Schreib's in die Kommentare.</div><div id="k135" class="clip cap" data-start="256.790" data-duration="0.920">Ich bin gespannt,</div><div id="k136" class="clip cap" data-start="257.730" data-duration="1.190">wie viele C-Menschen</div><div id="k137" class="clip cap" data-start="259.050" data-duration="0.860">hier sind.</div><div id="k138" class="clip cap" data-start="260.070" data-duration="2.800">Aber warum dir die perfekte Idee ausgerechnet</div><div id="k139" class="clip cap" data-start="262.890" data-duration="1.840">unter der Dusche einfällt</div><div id="k140" class="clip cap" data-start="264.890" data-duration="1.360">und nicht am Schreibtisch?</div><div id="k141" class="clip cap" data-start="266.390" data-duration="1.980">Das schauen wir uns nächstes Mal an.</div></div>
