<template>
  <style>
  #root { position:absolute; inset:0; }
  #root .cap { position:absolute; left:0; right:0; top:992px; text-align:center; font-family:'Inter', sans-serif;
          font-weight:500; font-size:36px; color:#F2F2F2; opacity:0; }
  </style>
  <div id="root" data-composition-id="captions" data-width="1920" data-height="1080" data-layout-allow-caption-zone><div id="k0" class="clip cap" data-start="2.950" data-duration="0.940">Das ist Otto.</div><div id="k1" class="clip cap" data-start="4.010" data-duration="2.360">Otto sitzt seit zwei Stunden vor einem</div><div id="k2" class="clip cap" data-start="6.390" data-duration="1.020">leeren Dokument.</div><div id="k3" class="clip cap" data-start="7.690" data-duration="2.640">Er braucht eine Idee für seine Präsentation.</div><div id="k4" class="clip cap" data-start="10.510" data-duration="0.840">Nichts.</div><div id="k5" class="clip cap" data-start="11.410" data-duration="1.480">Absolut nichts.</div><div id="k6" class="clip cap" data-start="13.310" data-duration="2.140">Also gibt er auf und geht duschen.</div><div id="k7" class="clip cap" data-start="15.550" data-duration="0.700">Und dann,</div><div id="k8" class="clip cap" data-start="16.650" data-duration="1.140">mitten im Shampoo:</div><div id="k9" class="clip cap" data-start="17.950" data-duration="1.340">die perfekte Idee.</div><div id="k10" class="clip cap" data-start="19.450" data-duration="0.900">Kein Stift.</div><div id="k11" class="clip cap" data-start="20.530" data-duration="0.880">Kein Handy.</div><div id="k12" class="clip cap" data-start="21.590" data-duration="1.100">Nur Schaum.</div><div id="k13" class="clip cap" data-start="22.930" data-duration="2.600">Warum kommt die beste Idee genau dann,</div><div id="k14" class="clip cap" data-start="25.770" data-duration="1.800">wenn du gar nicht danach suchst?</div><div id="k15" class="clip cap" data-start="27.610" data-duration="0.920">Kurze Frage an dich:</div><div id="k16" class="clip cap" data-start="28.550" data-duration="2.240">Wo kommen dir die besten Ideen?</div><div id="k17" class="clip cap" data-start="30.810" data-duration="0.000">A:</div><div id="k18" class="clip cap" data-start="30.830" data-duration="1.000">unter der Dusche.</div><div id="k19" class="clip cap" data-start="31.850" data-duration="0.240">B:</div><div id="k20" class="clip cap" data-start="32.110" data-duration="1.110">beim Spazierengehen.</div><div id="k21" class="clip cap" data-start="33.370" data-duration="0.900">Oder C:</div><div id="k22" class="clip cap" data-start="34.290" data-duration="1.980">kurz vorm Einschlafen?</div><div id="k23" class="clip cap" data-start="36.490" data-duration="1.320">Merk dir deine Antwort.</div><div id="k24" class="clip cap" data-start="38.190" data-duration="1.560">Am Ende verrate ich dir,</div><div id="k25" class="clip cap" data-start="40.090" data-duration="2.480">was alle drei Orte gemeinsam haben.</div><div id="k26" class="clip cap" data-start="47.172" data-duration="2.318">Erst mal ein kleines Experiment.</div><div id="k27" class="clip cap" data-start="49.910" data-duration="1.660">Du hast zehn Sekunden:</div><div id="k28" class="clip cap" data-start="51.750" data-duration="2.100">Was kann man alles mit einem Ziegelstein</div><div id="k29" class="clip cap" data-start="54.767" data-duration="0.000">machen?</div><div id="k30" class="clip cap" data-start="54.787" data-duration="7.823">Los!</div><div id="k31" class="clip cap" data-start="65.547" data-duration="0.523">Und?</div><div id="k32" class="clip cap" data-start="66.150" data-duration="0.520">Wahrscheinlich:</div><div id="k33" class="clip cap" data-start="66.690" data-duration="1.040">bauen,</div><div id="k34" class="clip cap" data-start="68.090" data-duration="0.720">werfen,</div><div id="k35" class="clip cap" data-start="68.990" data-duration="1.660">vielleicht Türstopper.</div><div id="k36" class="clip cap" data-start="70.730" data-duration="2.380">Die meisten bleiben bei den naheliegenden Ideen</div><div id="k37" class="clip cap" data-start="73.130" data-duration="0.580">hängen.</div><div id="k38" class="clip cap" data-start="73.990" data-duration="2.460">Genau das passiert Otto am Schreibtisch.</div><div id="k39" class="clip cap" data-start="76.610" data-duration="1.440">Wenn du dich verbissen auf ein Problem</div><div id="k40" class="clip cap" data-start="78.070" data-duration="1.300">konzentrierst,</div><div id="k41" class="clip cap" data-start="79.490" data-duration="2.520">läuft dein Denken immer wieder dieselben Wege</div><div id="k42" class="clip cap" data-start="82.030" data-duration="0.360">entlang.</div><div id="k43" class="clip cap" data-start="82.410" data-duration="2.880">Psychologen nennen das Fixierung.</div><div id="k44" class="clip cap" data-start="85.550" data-duration="2.100">Du suchst nicht nach neuen Lösungen,</div><div id="k45" class="clip cap" data-start="87.810" data-duration="1.700">du drehst dich im Kreis um die</div><div id="k46" class="clip cap" data-start="89.530" data-duration="0.720">erste,</div><div id="k47" class="clip cap" data-start="90.270" data-duration="1.380">die dir eingefallen ist.</div><div id="k48" class="clip cap" data-start="91.970" data-duration="2.140">Der Psychologe Karl Duncker hat das schon</div><div id="k49" class="clip cap" data-start="94.130" data-duration="1.030">in den Dreißigerjahren</div><div id="k50" class="clip cap" data-start="95.250" data-duration="0.740">gezeigt.</div><div id="k51" class="clip cap" data-start="96.390" data-duration="1.880">Er gab Menschen eine Kerze,</div><div id="k52" class="clip cap" data-start="98.450" data-duration="2.880">eine Schachtel Reißzwecken und Streichhölzer.</div><div id="k53" class="clip cap" data-start="101.590" data-duration="0.900">Die Aufgabe:</div><div id="k54" class="clip cap" data-start="102.890" data-duration="2.400">Befestige die Kerze so an der Wand,</div><div id="k55" class="clip cap" data-start="105.390" data-duration="2.300">dass kein Wachs auf den Tisch tropft.</div><div id="k56" class="clip cap" data-start="107.930" data-duration="1.000">Die meisten versuchen,</div><div id="k57" class="clip cap" data-start="108.950" data-duration="1.960">die Kerze an die Wand zu nageln</div><div id="k58" class="clip cap" data-start="110.930" data-duration="2.260">oder mit Wachs festzukleben.</div><div id="k59" class="clip cap" data-start="113.370" data-duration="0.820">Die Lösung:</div><div id="k60" class="clip cap" data-start="114.430" data-duration="1.320">Schachtel ausleeren,</div><div id="k61" class="clip cap" data-start="115.990" data-duration="1.160">an die Wand pinnen,</div><div id="k62" class="clip cap" data-start="117.270" data-duration="1.220">Kerze reinstellen.</div><div id="k63" class="clip cap" data-start="118.790" data-duration="0.820">Fertig.</div><div id="k64" class="clip cap" data-start="119.890" data-duration="1.700">Aber weil die Schachtel im Kopf als</div><div id="k65" class="clip cap" data-start="121.610" data-duration="2.740">Behälter für Reißzwecken abgespeichert ist,</div><div id="k66" class="clip cap" data-start="124.550" data-duration="2.560">sieht kaum jemand das kleine Regal darin.</div><div id="k67" class="clip cap" data-start="127.130" data-duration="1.520">Und es kommt noch dicker:</div><div id="k68" class="clip cap" data-start="128.790" data-duration="2.560">Wer einmal einen Lösungsweg gelernt hat,</div><div id="k69" class="clip cap" data-start="131.430" data-duration="1.320">benutzt ihn auch dann noch,</div><div id="k70" class="clip cap" data-start="132.770" data-duration="2.260">wenn es einen viel einfacheren gibt.</div><div id="k71" class="clip cap" data-start="135.390" data-duration="2.240">Das hat der Psychologe Abraham Luchins</div><div id="k72" class="clip cap" data-start="137.670" data-duration="3.190">mit simplen Rätseln zum Umfüllen von Wasserkrügen</div><div id="k73" class="clip cap" data-start="140.930" data-duration="0.680">gezeigt.</div><div id="k74" class="clip cap" data-start="142.130" data-duration="2.340">Und je verkrampfter Otto sucht,</div><div id="k75" class="clip cap" data-start="144.490" data-duration="1.940">desto tiefer wird die Spur.</div><div id="k76" class="clip cap" data-start="148.589" data-duration="2.921">Unter der Dusche passiert etwas anderes.</div><div id="k77" class="clip cap" data-start="151.790" data-duration="1.700">Duschen kannst du im Schlaf.</div><div id="k78" class="clip cap" data-start="153.750" data-duration="1.680">Dein Körper ist beschäftigt,</div><div id="k79" class="clip cap" data-start="155.470" data-duration="1.660">dein Kopf ist frei.</div><div id="k80" class="clip cap" data-start="157.270" data-duration="1.820">Und dann fangen deine Gedanken an zu</div><div id="k81" class="clip cap" data-start="159.110" data-duration="0.720">wandern.</div><div id="k82" class="clip cap" data-start="159.930" data-duration="1.660">Das ist übrigens völlig normal:</div><div id="k83" class="clip cap" data-start="161.870" data-duration="2.140">Eine große Studie aus Harvard kam zu</div><div id="k84" class="clip cap" data-start="164.030" data-duration="0.600">dem Ergebnis,</div><div id="k85" class="clip cap" data-start="164.650" data-duration="2.680">dass unsere Gedanken fast die Hälfte der</div><div id="k86" class="clip cap" data-start="167.350" data-duration="1.700">wachen Zeit abschweifen.</div><div id="k87" class="clip cap" data-start="169.230" data-duration="2.240">Hirnforscher kennen ein Netzwerk,</div><div id="k88" class="clip cap" data-start="171.550" data-duration="1.760">das genau dann aktiv wird,</div><div id="k89" class="clip cap" data-start="173.330" data-duration="1.740">wenn wir nichts Bestimmtes tun:</div><div id="k90" class="clip cap" data-start="175.290" data-duration="1.470">das Ruhezustandsnetzwerk,</div><div id="k91" class="clip cap" data-start="177.490" data-duration="3.040">auf Englisch Default Mode Network.</div><div id="k92" class="clip cap" data-start="180.710" data-duration="1.600">Es verknüpft Erinnerungen,</div><div id="k93" class="clip cap" data-start="182.490" data-duration="1.220">Bilder und Gedanken,</div><div id="k94" class="clip cap" data-start="183.870" data-duration="2.640">die sonst nichts miteinander zu tun haben.</div><div id="k95" class="clip cap" data-start="186.650" data-duration="1.760">Genau das ist der Stoff,</div><div id="k96" class="clip cap" data-start="188.430" data-duration="1.700">aus dem neue Ideen sind.</div><div id="k97" class="clip cap" data-start="190.150" data-duration="2.380">Eine Studie aus dem Jahr zweitausendzweiundzwanzig</div><div id="k98" class="clip cap" data-start="192.770" data-duration="1.200">hat gezeigt:</div><div id="k99" class="clip cap" data-start="194.410" data-duration="2.500">Am meisten hilft eine Tätigkeit,</div><div id="k100" class="clip cap" data-start="197.090" data-duration="2.180">die dich nur ein bisschen beschäftigt.</div><div id="k101" class="clip cap" data-start="199.330" data-duration="1.240">Nicht zu langweilig,</div><div id="k102" class="clip cap" data-start="200.590" data-duration="1.220">nicht zu anstrengend.</div><div id="k103" class="clip cap" data-start="201.890" data-duration="1.140">Also genau wie Duschen.</div><div id="k104" class="clip cap" data-start="203.050" data-duration="1.770">Oder Spazierengehen.</div><div id="k105" class="clip cap" data-start="205.390" data-duration="2.180">Und die Dusche hat noch einen Vorteil:</div><div id="k106" class="clip cap" data-start="207.670" data-duration="2.000">Sie ist einer der letzten Orte</div><div id="k107" class="clip cap" data-start="209.690" data-duration="1.400">ohne Bildschirm.</div><div id="k108" class="clip cap" data-start="211.210" data-duration="0.860">Kein Handy,</div><div id="k109" class="clip cap" data-start="212.350" data-duration="0.920">keine Mails,</div><div id="k110" class="clip cap" data-start="213.450" data-duration="1.140">keine Nachrichten.</div><div id="k111" class="clip cap" data-start="214.750" data-duration="1.280">Das warme Wasser entspannt,</div><div id="k112" class="clip cap" data-start="216.050" data-duration="3.700">das gleichmäßige Rauschen schirmt Geräusche ab.</div><div id="k113" class="clip cap" data-start="219.850" data-duration="1.960">Du bist allein mit deinen Gedanken.</div><div id="k114" class="clip cap" data-start="222.090" data-duration="3.000">Und genau das passiert im Alltag sonst</div><div id="k115" class="clip cap" data-start="225.110" data-duration="1.100">kaum noch.</div><div id="k116" class="clip cap" data-start="228.391" data-duration="0.999">Aber Achtung:</div><div id="k117" class="clip cap" data-start="229.530" data-duration="2.320">Die Dusche zaubert keine Ideen aus dem</div><div id="k118" class="clip cap" data-start="231.870" data-duration="0.580">Nichts.</div><div id="k119" class="clip cap" data-start="232.650" data-duration="2.960">Der Mathematiker Henri Poincaré hat beschrieben,</div><div id="k120" class="clip cap" data-start="235.930" data-duration="1.980">wie ihm die Lösung für ein Problem,</div><div id="k121" class="clip cap" data-start="237.930" data-duration="1.920">an dem er wochenlang gesessen hatte,</div><div id="k122" class="clip cap" data-start="240.090" data-duration="1.580">plötzlich einfiel,</div><div id="k123" class="clip cap" data-start="241.710" data-duration="1.900">als er in einen Bus stieg.</div><div id="k124" class="clip cap" data-start="243.750" data-duration="2.240">Ohne die Wochen davor wäre sie nie</div><div id="k125" class="clip cap" data-start="246.010" data-duration="0.680">gekommen.</div><div id="k126" class="clip cap" data-start="246.870" data-duration="2.520">Psychologen nennen das Inkubation:</div><div id="k127" class="clip cap" data-start="249.770" data-duration="2.440">Erst arbeitest du hart an einem Problem.</div><div id="k128" class="clip cap" data-start="252.350" data-duration="1.240">Dann lässt du los.</div><div id="k129" class="clip cap" data-start="253.810" data-duration="2.500">Und im Hintergrund arbeitet dein Gehirn weiter.</div><div id="k130" class="clip cap" data-start="256.530" data-duration="1.440">Viele Studien zeigen:</div><div id="k131" class="clip cap" data-start="258.330" data-duration="2.280">Eine Pause nach der Anstrengung bringt oft</div><div id="k132" class="clip cap" data-start="260.630" data-duration="1.280">bessere Lösungen,</div><div id="k133" class="clip cap" data-start="262.050" data-duration="1.960">als stur weiterzumachen.</div><div id="k134" class="clip cap" data-start="264.130" data-duration="3.420">Schon neunzehnhundertsechsundzwanzig hat der Psychologe Graham Wallas</div><div id="k135" class="clip cap" data-start="267.570" data-duration="2.440">das in vier Phasen beschrieben:</div><div id="k136" class="clip cap" data-start="270.150" data-duration="0.620">Vorbereitung,</div><div id="k137" class="clip cap" data-start="270.790" data-duration="1.460">Inkubation,</div><div id="k138" class="clip cap" data-start="272.650" data-duration="2.300">Erleuchtung und Überprüfung.</div><div id="k139" class="clip cap" data-start="274.970" data-duration="2.040">Die letzte Phase wird gern vergessen.</div><div id="k140" class="clip cap" data-start="277.210" data-duration="1.450">Denn nicht jede Dusch-Idee</div><div id="k141" class="clip cap" data-start="278.750" data-duration="0.860">ist genial.</div><div id="k142" class="clip cap" data-start="279.890" data-duration="2.160">Manche sehen beim Abtrocknen schon ganz anders</div><div id="k143" class="clip cap" data-start="282.070" data-duration="0.680">aus.</div><div id="k144" class="clip cap" data-start="282.970" data-duration="2.340">Und kurz bevor der Geistesblitz kommt,</div><div id="k145" class="clip cap" data-start="285.650" data-duration="2.520">blendet dein Gehirn die Außenwelt für einen</div><div id="k146" class="clip cap" data-start="288.190" data-duration="1.680">Moment ein Stück weit aus,</div><div id="k147" class="clip cap" data-start="289.890" data-duration="2.220">damit die leise Idee durchkommt.</div><div id="k148" class="clip cap" data-start="292.130" data-duration="1.540">Pausier mal kurz:</div><div id="k149" class="clip cap" data-start="293.890" data-duration="2.600">Wann hattest du deinen letzten Geistesblitz?</div><div id="k150" class="clip cap" data-start="296.650" data-duration="1.120">Und was hast du in dem Moment</div><div id="k151" class="clip cap" data-start="297.790" data-duration="1.120">gerade gemacht?</div><div id="k152" class="clip cap" data-start="302.536" data-duration="1.274">Die gute Nachricht:</div><div id="k153" class="clip cap" data-start="303.990" data-duration="2.280">Du musst nicht dreimal am Tag duschen.</div><div id="k154" class="clip cap" data-start="306.390" data-duration="2.640">Du kannst den Dusch-Effekt gezielt nutzen.</div><div id="k155" class="clip cap" data-start="309.210" data-duration="0.820">Mit fünf Hacks.</div><div id="k156" class="clip cap" data-start="310.050" data-duration="1.400">Hack Nummer eins:</div><div id="k157" class="clip cap" data-start="311.570" data-duration="1.060">Erst füttern,</div><div id="k158" class="clip cap" data-start="312.810" data-duration="1.080">dann loslassen.</div><div id="k159" class="clip cap" data-start="313.990" data-duration="2.440">Beschäftige dich zwanzig Minuten richtig mit dem</div><div id="k160" class="clip cap" data-start="316.450" data-duration="0.700">Problem.</div><div id="k161" class="clip cap" data-start="317.330" data-duration="1.460">Erst dann kommt die Pause.</div><div id="k162" class="clip cap" data-start="319.030" data-duration="2.260">Ohne Futter kein Geistesblitz.</div><div id="k163" class="clip cap" data-start="321.310" data-duration="1.580">Hack Nummer zwei:</div><div id="k164" class="clip cap" data-start="323.010" data-duration="2.260">Langweilige Pause statt Handy.</div><div id="k165" class="clip cap" data-start="325.450" data-duration="1.500">Wer in der Pause scrollt,</div><div id="k166" class="clip cap" data-start="326.970" data-duration="2.000">füllt den Kopf sofort wieder auf.</div><div id="k167" class="clip cap" data-start="328.990" data-duration="1.980">Dann können die Gedanken nicht wandern.</div><div id="k168" class="clip cap" data-start="331.070" data-duration="1.780">In einer Studie wurden die Ideen vor</div><div id="k169" class="clip cap" data-start="332.870" data-duration="1.060">allem dann besser,</div><div id="k170" class="clip cap" data-start="334.090" data-duration="1.920">wenn die Pause aus einer einfachen,</div><div id="k171" class="clip cap" data-start="336.030" data-duration="2.060">eher langweiligen Aufgabe bestand.</div><div id="k172" class="clip cap" data-start="338.110" data-duration="1.240">Hack Nummer drei:</div><div id="k173" class="clip cap" data-start="339.370" data-duration="1.200">Beweg dich.</div><div id="k174" class="clip cap" data-start="340.690" data-duration="2.700">In einer Studie der Stanford University hatten</div><div id="k175" class="clip cap" data-start="343.410" data-duration="3.220">Menschen beim Gehen deutlich mehr kreative Ideen</div><div id="k176" class="clip cap" data-start="346.650" data-duration="0.840">als im Sitzen.</div><div id="k177" class="clip cap" data-start="347.510" data-duration="1.480">Hack Nummer vier:</div><div id="k178" class="clip cap" data-start="349.210" data-duration="0.880">der Ideen-Fänger.</div><div id="k179" class="clip cap" data-start="350.110" data-duration="2.440">Leg Zettel und Stift neben dein Bett,</div><div id="k180" class="clip cap" data-start="352.710" data-duration="2.200">nimm unterwegs eine Sprachnotiz auf.</div><div id="k181" class="clip cap" data-start="355.010" data-duration="0.400">Und ja:</div><div id="k182" class="clip cap" data-start="355.430" data-duration="2.760">Es gibt sogar wasserfeste Notizblöcke für die</div><div id="k183" class="clip cap" data-start="358.210" data-duration="0.340">Dusche.</div><div id="k184" class="clip cap" data-start="358.570" data-duration="1.460">Hack Nummer fünf:</div><div id="k185" class="clip cap" data-start="360.370" data-duration="0.900">Schlaf drüber.</div><div id="k186" class="clip cap" data-start="361.350" data-duration="1.120">In einem Experiment,</div><div id="k187" class="clip cap" data-start="362.550" data-duration="2.480">das im Fachjournal Nature erschienen ist,</div><div id="k188" class="clip cap" data-start="365.210" data-duration="2.880">sollten Versuchspersonen Zahlenaufgaben lösen,</div><div id="k189" class="clip cap" data-start="368.230" data-duration="2.520">in denen eine versteckte Abkürzung steckte.</div><div id="k190" class="clip cap" data-start="370.790" data-duration="1.780">Wer zwischendurch geschlafen hatte,</div><div id="k191" class="clip cap" data-start="372.750" data-duration="2.160">entdeckte die Abkürzung mehr als doppelt so</div><div id="k192" class="clip cap" data-start="374.930" data-duration="1.380">oft wie die Leute,</div><div id="k193" class="clip cap" data-start="376.330" data-duration="2.204">die die gleiche Zeit wach geblieben waren.</div><div id="k194" class="clip cap" data-start="378.554" data-duration="1.256">Otto hat es ausprobiert.</div><div id="k195" class="clip cap" data-start="379.830" data-duration="3.180">Zwanzig Minuten volle Konzentration,</div><div id="k196" class="clip cap" data-start="383.350" data-duration="1.400">dann eine Runde um den Block,</div><div id="k197" class="clip cap" data-start="384.770" data-duration="1.460">ohne Handy.</div><div id="k198" class="clip cap" data-start="386.330" data-duration="1.820">Die Idee kam an der Ampel.</div><div id="k199" class="clip cap" data-start="388.330" data-duration="2.400">Und diesmal hatte er sein Notizbuch dabei.</div><div id="k200" class="clip cap" data-start="390.950" data-duration="1.020">Und jetzt du:</div><div id="k201" class="clip cap" data-start="392.070" data-duration="2.060">Denk nochmal an den Ziegelstein.</div><div id="k202" class="clip cap" data-start="394.310" data-duration="2.060">Fallen dir jetzt mehr Ideen ein als</div><div id="k203" class="clip cap" data-start="396.390" data-duration="0.760">am Anfang?</div><div id="k204" class="clip cap" data-start="397.370" data-duration="2.280">Schreib deine verrückteste in die Kommentare.</div><div id="k205" class="clip cap" data-start="399.670" data-duration="1.300">Und verrat mir:</div><div id="k206" class="clip cap" data-start="400.990" data-duration="1.000">A,</div><div id="k207" class="clip cap" data-start="402.030" data-duration="1.420">B oder C,</div><div id="k208" class="clip cap" data-start="403.650" data-duration="2.100">wo kommen dir die besten Ideen?</div><div id="k209" class="clip cap" data-start="405.790" data-duration="0.900">Übrigens:</div><div id="k210" class="clip cap" data-start="406.850" data-duration="2.520">Alle drei Orte haben eins gemeinsam.</div><div id="k211" class="clip cap" data-start="409.570" data-duration="2.740">Dein Kopf darf dort endlich wandern.</div><div id="k212" class="clip cap" data-start="412.450" data-duration="0.860">Und bei C,</div><div id="k213" class="clip cap" data-start="413.590" data-duration="1.520">kurz vorm Einschlafen,</div><div id="k214" class="clip cap" data-start="415.210" data-duration="2.400">arbeitet er sogar im Schlaf noch weiter.</div><div id="k215" class="clip cap" data-start="417.690" data-duration="1.800">Aber warum greifst du in jeder Pause</div><div id="k216" class="clip cap" data-start="419.510" data-duration="1.300">sofort zum Handy?</div><div id="k217" class="clip cap" data-start="420.990" data-duration="1.480">Und warum bist du nach fünf Minuten</div><div id="k218" class="clip cap" data-start="422.490" data-duration="1.560">Arbeit schon wieder dran?</div><div id="k219" class="clip cap" data-start="424.210" data-duration="1.920">Das schauen wir uns nächstes Mal an.</div></div>
