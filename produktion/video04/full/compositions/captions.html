  #root .cap { position:absolute; left:0; right:0; top:992px; text-align:center; font-family:'Inter', sans-serif;

  <div id="root" data-composition-id="captions" data-width="1920" data-height="1080" data-layout-allow-caption-zone><div id="k0" class="clip cap" data-start="2.950" data-duration="1.300">Das ist Otto.</div><div id="k1" class="clip cap" data-start="4.390" data-duration="1.760">Otto hat sich fest vorgenommen:</div><div id="k2" class="clip cap" data-start="6.490" data-duration="3.120">Heute arbeite ich eine Stunde am Stück.</div><div id="k3" class="clip cap" data-start="9.770" data-duration="0.320">Handy?</div><div id="k4" class="clip cap" data-start="10.110" data-duration="1.360">Liegt daneben.</div><div id="k5" class="clip cap" data-start="11.610" data-duration="0.720">Kein Problem.</div><div id="k6" class="clip cap" data-start="12.530" data-duration="1.660">Er öffnet die Datei.</div><div id="k7" class="clip cap" data-start="14.330" data-duration="1.300">Schreibt einen Satz.</div><div id="k8" class="clip cap" data-start="15.730" data-duration="0.960">Löscht ihn wieder.</div><div id="k9" class="clip cap" data-start="16.870" data-duration="0.660">Und dann,</div><div id="k10" class="clip cap" data-start="17.810" data-duration="1.980">ohne dass er es überhaupt merkt,</div><div id="k11" class="clip cap" data-start="19.810" data-duration="1.620">hat er sein Handy in der Hand.</div><div id="k12" class="clip cap" data-start="21.490" data-duration="1.060">Kein Anruf.</div><div id="k13" class="clip cap" data-start="22.670" data-duration="1.040">Keine Nachricht.</div><div id="k14" class="clip cap" data-start="23.810" data-duration="0.840">Einfach so.</div><div id="k15" class="clip cap" data-start="24.970" data-duration="1.730">Vier Minuten und siebenunddreißig</div><div id="k16" class="clip cap" data-start="26.770" data-duration="1.120">Sekunden.</div><div id="k17" class="clip cap" data-start="27.910" data-duration="0.860">Neuer Rekord.</div><div id="k18" class="clip cap" data-start="28.790" data-duration="1.720">Und das Schlimmste:</div><div id="k19" class="clip cap" data-start="30.650" data-duration="2.160">Danach weiß er nicht einmal mehr,</div><div id="k20" class="clip cap" data-start="32.970" data-duration="2.160">was er eigentlich nachschauen wollte.</div><div id="k21" class="clip cap" data-start="35.310" data-duration="2.020">Warum greifen wir zum Handy,</div><div id="k22" class="clip cap" data-start="37.610" data-duration="1.920">obwohl gar nichts passiert ist?</div><div id="k23" class="clip cap" data-start="39.650" data-duration="2.400">Und warum ist es so verdammt schwer,</div><div id="k24" class="clip cap" data-start="42.370" data-duration="1.620">es einfach liegen zu lassen?</div><div id="k25" class="clip cap" data-start="44.230" data-duration="1.660">Kurze Schätzfrage an dich:</div><div id="k26" class="clip cap" data-start="46.170" data-duration="2.020">Wie oft hast du dein Handy heute</div><div id="k27" class="clip cap" data-start="48.210" data-duration="1.200">schon entsperrt?</div><div id="k28" class="clip cap" data-start="49.530" data-duration="0.160">A:</div><div id="k29" class="clip cap" data-start="49.710" data-duration="1.960">weniger als zwanzig Mal.</div><div id="k30" class="clip cap" data-start="51.690" data-duration="1.250">B:</div><div id="k31" class="clip cap" data-start="52.960" data-duration="2.050">zwanzig bis fünfzig Mal.</div><div id="k32" class="clip cap" data-start="55.130" data-duration="1.260">Oder C:</div><div id="k33" class="clip cap" data-start="57.010" data-duration="1.440">mehr als fünfzig Mal?</div><div id="k34" class="clip cap" data-start="58.710" data-duration="1.400">Merk dir deinen Tipp.</div><div id="k35" class="clip cap" data-start="60.270" data-duration="1.300">Gleich zeige ich dir,</div><div id="k36" class="clip cap" data-start="61.670" data-duration="1.700">wie du es nachprüfen kannst.</div><div id="k37" class="clip cap" data-start="68.288" data-duration="3.342">Die Informatikerin Gloria Mark erforscht seit über</div><div id="k38" class="clip cap" data-start="71.650" data-duration="1.200">zwanzig Jahren,</div><div id="k39" class="clip cap" data-start="73.030" data-duration="1.700">wie lange wir uns am Bildschirm auf</div><div id="k40" class="clip cap" data-start="74.750" data-duration="1.540">eine Sache konzentrieren.</div><div id="k41" class="clip cap" data-start="76.330" data-duration="1.210">Anfang der zweitausender</div><div id="k42" class="clip cap" data-start="77.630" data-duration="1.920">Jahre waren es im Schnitt noch etwa</div><div id="k43" class="clip cap" data-start="79.570" data-duration="1.420">zweieinhalb Minuten.</div><div id="k44" class="clip cap" data-start="81.290" data-duration="1.300">In ihren neueren Messungen:</div><div id="k45" class="clip cap" data-start="82.610" data-duration="2.940">rund siebenundvierzig Sekunden.</div><div id="k46" class="clip cap" data-start="85.610" data-duration="1.620">Und jetzt kommt das Verrückte:</div><div id="k47" class="clip cap" data-start="87.330" data-duration="2.420">Ein großer Teil dieser Unterbrechungen kommt gar</div><div id="k48" class="clip cap" data-start="89.770" data-duration="1.080">nicht von außen.</div><div id="k49" class="clip cap" data-start="91.350" data-duration="2.160">In einer ihrer Studien unterbrachen sich die</div><div id="k50" class="clip cap" data-start="93.530" data-duration="2.480">Menschen ungefähr genauso oft selbst,</div><div id="k51" class="clip cap" data-start="96.050" data-duration="2.480">wie sie von anderen unterbrochen wurden.</div><div id="k52" class="clip cap" data-start="98.690" data-duration="1.260">Niemand ruft an.</div><div id="k53" class="clip cap" data-start="100.190" data-duration="1.560">Wir rufen uns selbst ab.</div><div id="k54" class="clip cap" data-start="101.870" data-duration="2.580">Psychologen nennen so etwas eine Gewohnheit.</div><div id="k55" class="clip cap" data-start="104.910" data-duration="2.820">Und Gewohnheiten funktionieren wie eine Schleife:</div><div id="k56" class="clip cap" data-start="107.890" data-duration="1.220">Ein Auslöser,</div><div id="k57" class="clip cap" data-start="109.150" data-duration="2.440">zum Beispiel ein kurzer Moment Langeweile.</div><div id="k58" class="clip cap" data-start="112.050" data-duration="1.160">Eine Handlung:</div><div id="k59" class="clip cap" data-start="113.350" data-duration="1.040">der Griff zum Handy.</div><div id="k60" class="clip cap" data-start="114.410" data-duration="1.960">Und eine Belohnung:</div><div id="k61" class="clip cap" data-start="116.810" data-duration="1.340">irgendwas Neues.</div><div id="k62" class="clip cap" data-start="118.290" data-duration="0.680">Jedes Mal,</div><div id="k63" class="clip cap" data-start="118.990" data-duration="1.820">wenn dort etwas Spannendes wartet,</div><div id="k64" class="clip cap" data-start="121.090" data-duration="1.940">wird die Schleife ein Stück stärker.</div><div id="k65" class="clip cap" data-start="123.190" data-duration="2.140">Wiederhol das ein paar tausend Mal,</div><div id="k66" class="clip cap" data-start="125.590" data-duration="1.520">und dein Gehirn braucht dich gar nicht</div><div id="k67" class="clip cap" data-start="127.130" data-duration="0.920">mehr zu fragen.</div><div id="k68" class="clip cap" data-start="128.610" data-duration="1.860">Die Hand greift von allein.</div><div id="k69" class="clip cap" data-start="130.530" data-duration="3.020">So automatisch wie Zähneputzen.</div><div id="k70" class="clip cap" data-start="135.127" data-duration="2.763">Aber warum ausgerechnet das Handy?</div><div id="k71" class="clip cap" data-start="137.910" data-duration="2.760">Der Psychologe Skinner hat schon vor Jahrzehnten</div><div id="k72" class="clip cap" data-start="140.690" data-duration="0.780">gezeigt:</div><div id="k73" class="clip cap" data-start="141.930" data-duration="2.460">Tauben picken am ausdauerndsten,</div><div id="k74" class="clip cap" data-start="144.570" data-duration="0.880">wenn sie nicht wissen,</div><div id="k75" class="clip cap" data-start="145.470" data-duration="1.700">wann das nächste Futter kommt.</div><div id="k76" class="clip cap" data-start="147.350" data-duration="1.420">Mal nach zwei Versuchen,</div><div id="k77" class="clip cap" data-start="149.070" data-duration="1.240">mal nach zwanzig.</div><div id="k78" class="clip cap" data-start="150.510" data-duration="2.900">Genau diese Unberechenbarkeit hält sie bei der</div><div id="k79" class="clip cap" data-start="153.430" data-duration="0.320">Stange.</div><div id="k80" class="clip cap" data-start="153.770" data-duration="2.160">Dein Handy funktioniert genauso.</div><div id="k81" class="clip cap" data-start="156.310" data-duration="2.160">Manchmal wartet eine Nachricht.</div><div id="k82" class="clip cap" data-start="158.610" data-duration="1.320">Manchmal ein Like.</div><div id="k83" class="clip cap" data-start="160.010" data-duration="0.660">Meistens:</div><div id="k84" class="clip cap" data-start="160.690" data-duration="1.260">gar nichts.</div><div id="k85" class="clip cap" data-start="162.090" data-duration="2.000">Aber du weißt es eben nie vorher.</div><div id="k86" class="clip cap" data-start="164.250" data-duration="1.500">Also schaust du nach.</div><div id="k87" class="clip cap" data-start="165.890" data-duration="0.520">Und nochmal.</div><div id="k88" class="clip cap" data-start="166.430" data-duration="1.480">Und nochmal.</div><div id="k89" class="clip cap" data-start="168.030" data-duration="1.800">Wie an einem Spielautomaten,</div><div id="k90" class="clip cap" data-start="170.010" data-duration="2.620">nur dass dieser in deiner Hosentasche wohnt.</div><div id="k91" class="clip cap" data-start="172.650" data-duration="2.540">Und viele Apps sind genau so gebaut:</div><div id="k92" class="clip cap" data-start="175.490" data-duration="1.660">Der Feed hört nie auf,</div><div id="k93" class="clip cap" data-start="177.290" data-duration="2.380">und das Runterziehen zum Aktualisieren</div><div id="k94" class="clip cap" data-start="179.810" data-duration="1.680">fühlt sich an wie der Hebel am</div><div id="k95" class="clip cap" data-start="181.510" data-duration="0.900">Automaten.</div><div id="k96" class="clip cap" data-start="182.550" data-duration="0.640">Dazu kommt:</div><div id="k97" class="clip cap" data-start="183.210" data-duration="3.580">Dein Belohnungssystem reagiert nicht erst auf die</div><div id="k98" class="clip cap" data-start="186.810" data-duration="1.080">Belohnung selbst,</div><div id="k99" class="clip cap" data-start="188.210" data-duration="1.800">sondern schon auf die Erwartung.</div><div id="k100" class="clip cap" data-start="190.130" data-duration="2.800">Das Kribbeln beim Entsperren ist oft der</div><div id="k101" class="clip cap" data-start="192.950" data-duration="1.120">eigentliche Kick,</div><div id="k102" class="clip cap" data-start="194.210" data-duration="0.880">nicht das,</div><div id="k103" class="clip cap" data-start="195.110" data-duration="1.240">was du dann siehst.</div><div id="k104" class="clip cap" data-start="198.460" data-duration="2.130">Erinnerst du dich an die erste Folge?</div><div id="k105" class="clip cap" data-start="200.830" data-duration="1.980">Aufschieben ist kein Zeitproblem,</div><div id="k106" class="clip cap" data-start="203.150" data-duration="1.620">sondern ein Gefühlsproblem.</div><div id="k107" class="clip cap" data-start="204.990" data-duration="1.840">Genau das passiert hier auch.</div><div id="k108" class="clip cap" data-start="207.070" data-duration="0.500">Schau mal,</div><div id="k109" class="clip cap" data-start="207.590" data-duration="1.700">wann Otto zum Handy greift:</div><div id="k110" class="clip cap" data-start="209.450" data-duration="1.480">nicht mitten im Flow.</div><div id="k111" class="clip cap" data-start="211.070" data-duration="1.400">Sondern genau in dem Moment,</div><div id="k112" class="clip cap" data-start="212.490" data-duration="2.240">in dem es unangenehm wird.</div><div id="k113" class="clip cap" data-start="214.890" data-duration="1.740">Der erste Satz will nicht kommen.</div><div id="k114" class="clip cap" data-start="216.810" data-duration="2.000">Die Aufgabe fühlt sich zäh an.</div><div id="k115" class="clip cap" data-start="218.830" data-duration="3.000">Und das Handy ist der schnellste Notausgang,</div><div id="k116" class="clip cap" data-start="221.850" data-duration="0.760">den es gibt.</div><div id="k117" class="clip cap" data-start="222.810" data-duration="0.480">Das Problem:</div><div id="k118" class="clip cap" data-start="223.310" data-duration="3.760">Dieser kurze Ausflug kostet mehr als die</div><div id="k119" class="clip cap" data-start="227.090" data-duration="1.000">paar Sekunden.</div><div id="k120" class="clip cap" data-start="228.230" data-duration="2.240">Die Forscherin Sophie Leroy hat gezeigt,</div><div id="k121" class="clip cap" data-start="230.930" data-duration="1.860">dass nach einem Wechsel ein Teil deiner</div><div id="k122" class="clip cap" data-start="232.810" data-duration="3.340">Aufmerksamkeit an der vorherigen Sache hängen bleibt.</div><div id="k123" class="clip cap" data-start="236.310" data-duration="2.220">Sie nennt das Aufmerksamkeitsrest.</div><div id="k124" class="clip cap" data-start="238.550" data-duration="2.140">Du bist zurück bei der Arbeit,</div><div id="k125" class="clip cap" data-start="240.710" data-duration="1.540">aber ein Stück von dir scrollt</div><div id="k126" class="clip cap" data-start="242.270" data-duration="0.480">noch.</div><div id="k127" class="clip cap" data-start="242.870" data-duration="2.000">In ihren Versuchen schnitten Menschen mit diesem</div><div id="k128" class="clip cap" data-start="244.890" data-duration="3.120">Rest bei der nächsten Aufgabe schlechter ab.</div><div id="k129" class="clip cap" data-start="248.090" data-duration="1.400">Und manchmal reicht schon,</div><div id="k130" class="clip cap" data-start="249.790" data-duration="1.660">dass das Handy nur da liegt.</div><div id="k131" class="clip cap" data-start="251.550" data-duration="3.920">In einem vielbeachteten Experiment schnitten Studierende schlechter</div><div id="k132" class="clip cap" data-start="255.490" data-duration="1.460">in Denkaufgaben ab,</div><div id="k133" class="clip cap" data-start="256.970" data-duration="1.940">wenn ihr Handy auf dem Tisch lag,</div><div id="k134" class="clip cap" data-start="259.090" data-duration="1.440">als wenn es in einem anderen Raum</div><div id="k135" class="clip cap" data-start="260.550" data-duration="0.580">war.</div><div id="k136" class="clip cap" data-start="261.210" data-duration="0.960">Selbst ausgeschaltet.</div><div id="k137" class="clip cap" data-start="262.190" data-duration="3.020">Folgestudien fanden den Effekt nicht immer gleich</div><div id="k138" class="clip cap" data-start="265.230" data-duration="0.680">stark.</div><div id="k139" class="clip cap" data-start="266.090" data-duration="1.980">Aber der Gedanke dahinter ist simpel:</div><div id="k140" class="clip cap" data-start="268.190" data-duration="1.160">Was du siehst,</div><div id="k141" class="clip cap" data-start="269.530" data-duration="0.920">zieht an dir.</div><div id="k142" class="clip cap" data-start="270.610" data-duration="1.840">Pausier mal kurz und mach den Check:</div><div id="k143" class="clip cap" data-start="272.610" data-duration="1.720">Schau in deine Bildschirmzeit,</div><div id="k144" class="clip cap" data-start="274.610" data-duration="1.400">wie oft du dein Handy heute schon</div><div id="k145" class="clip cap" data-start="276.030" data-duration="0.760">entsperrt hast.</div><div id="k146" class="clip cap" data-start="276.810" data-duration="1.760">Lag dein Tipp richtig?</div><div id="k147" class="clip cap" data-start="282.444" data-duration="1.046">Die gute Nachricht:</div><div id="k148" class="clip cap" data-start="283.510" data-duration="3.720">Gegen einen Reflex hilft keine Willenskraft.</div><div id="k149" class="clip cap" data-start="287.410" data-duration="1.320">Aber ein paar einfache Tricks.</div><div id="k150" class="clip cap" data-start="288.750" data-duration="1.300">Hack Nummer eins:</div><div id="k151" class="clip cap" data-start="290.070" data-duration="1.400">Aus den Augen.</div><div id="k152" class="clip cap" data-start="291.670" data-duration="1.220">Nicht umdrehen,</div><div id="k153" class="clip cap" data-start="293.110" data-duration="1.580">nicht lautlos stellen,</div><div id="k154" class="clip cap" data-start="294.930" data-duration="2.360">sondern in einen anderen Raum legen.</div><div id="k155" class="clip cap" data-start="297.450" data-duration="1.320">Was du nicht siehst,</div><div id="k156" class="clip cap" data-start="298.810" data-duration="1.060">kann dich nicht rufen.</div><div id="k157" class="clip cap" data-start="299.890" data-duration="1.660">Hack Nummer zwei:</div><div id="k158" class="clip cap" data-start="301.710" data-duration="1.460">Benachrichtigungen aus.</div><div id="k159" class="clip cap" data-start="303.410" data-duration="2.840">In einem Experiment berichteten Menschen in einer</div><div id="k160" class="clip cap" data-start="306.270" data-duration="3.400">Woche mit allen Benachrichtigungen deutlich häufiger von</div><div id="k161" class="clip cap" data-start="309.690" data-duration="3.000">Unaufmerksamkeit als in einer Woche ohne.</div><div id="k162" class="clip cap" data-start="312.830" data-duration="0.940">Lass nur durch,</div><div id="k163" class="clip cap" data-start="313.790" data-duration="1.860">was wirklich wichtig ist.</div><div id="k164" class="clip cap" data-start="315.950" data-duration="1.940">Und schau lieber zweimal pro Stunde bewusst</div><div id="k165" class="clip cap" data-start="317.910" data-duration="0.880">nach,</div><div id="k166" class="clip cap" data-start="318.930" data-duration="1.380">statt ständig nebenbei.</div><div id="k167" class="clip cap" data-start="320.330" data-duration="1.440">Hack Nummer drei:</div><div id="k168" class="clip cap" data-start="321.930" data-duration="1.260">Bau Reibung ein.</div><div id="k169" class="clip cap" data-start="323.430" data-duration="0.980">Schieb die Apps,</div><div id="k170" class="clip cap" data-start="324.490" data-duration="1.120">die dich am meisten ziehen,</div><div id="k171" class="clip cap" data-start="325.630" data-duration="3.000">vom Startbildschirm in einen Ordner.</div><div id="k172" class="clip cap" data-start="328.790" data-duration="1.000">Melde dich ab.</div><div id="k173" class="clip cap" data-start="329.890" data-duration="3.260">Jeder zusätzliche Handgriff unterbricht den Autopiloten.</div><div id="k174" class="clip cap" data-start="333.170" data-duration="1.480">Hack Nummer vier:</div><div id="k175" class="clip cap" data-start="334.850" data-duration="1.200">die Zehn-Sekunden-Regel.</div><div id="k176" class="clip cap" data-start="336.590" data-duration="1.220">Wenn der Drang kommt,</div><div id="k177" class="clip cap" data-start="338.230" data-duration="2.400">zähl langsam bis zehn und frag dich:</div><div id="k178" class="clip cap" data-start="340.770" data-duration="1.740">Was will ich gerade vermeiden?</div><div id="k179" class="clip cap" data-start="342.630" data-duration="1.600">Oft verschwindet der Griff,</div><div id="k180" class="clip cap" data-start="344.370" data-duration="1.640">sobald du ihn bemerkst.</div><div id="k181" class="clip cap" data-start="346.090" data-duration="0.840">Und wenn nicht:</div><div id="k182" class="clip cap" data-start="346.990" data-duration="2.060">Handyzeit gibt es erst nach dem nächsten</div><div id="k183" class="clip cap" data-start="349.070" data-duration="2.260">Mini-Countdown aus Folge zwei.</div><div id="k184" class="clip cap" data-start="351.350" data-duration="1.520">Hack Nummer fünf:</div><div id="k185" class="clip cap" data-start="353.030" data-duration="1.580">Halte Langeweile aus.</div><div id="k186" class="clip cap" data-start="354.830" data-duration="1.480">Wie wir in der letzten Folge gesehen</div><div id="k187" class="clip cap" data-start="356.330" data-duration="0.740">haben:</div><div id="k188" class="clip cap" data-start="357.390" data-duration="2.920">Genau in den langweiligen Momenten kommen die</div><div id="k189" class="clip cap" data-start="360.330" data-duration="1.260">besten Ideen.</div><div id="k190" class="clip cap" data-start="361.610" data-duration="2.000">Wer jede Lücke mit dem Handy füllt,</div><div id="k191" class="clip cap" data-start="363.890" data-duration="1.920">nimmt sich die Dusch-Momente weg.</div><div id="k192" class="clip cap" data-start="365.830" data-duration="1.580">Otto hat es ausprobiert.</div><div id="k193" class="clip cap" data-start="367.570" data-duration="1.160">Handy in die Küche.</div><div id="k194" class="clip cap" data-start="368.830" data-duration="2.020">Die ersten zehn Minuten griff seine Hand</div><div id="k195" class="clip cap" data-start="370.870" data-duration="1.520">immer wieder ins Leere.</div><div id="k196" class="clip cap" data-start="372.410" data-duration="0.260">Dann:</div><div id="k197" class="clip cap" data-start="372.690" data-duration="1.780">eine Stunde am Stück.</div><div id="k198" class="clip cap" data-start="374.610" data-duration="0.880">Die Präsentation?</div><div id="k199" class="clip cap" data-start="375.510" data-duration="1.500">Fast fertig.</div><div id="k200" class="clip cap" data-start="377.310" data-duration="1.120">Und das Beste:</div><div id="k201" class="clip cap" data-start="378.750" data-duration="2.160">Er hatte danach nicht das Gefühl,</div><div id="k202" class="clip cap" data-start="380.930" data-duration="1.860">irgendetwas verpasst zu haben.</div><div id="k203" class="clip cap" data-start="382.970" data-duration="0.680">Und du?</div><div id="k204" class="clip cap" data-start="383.990" data-duration="1.460">Wie oft hast du dein Handy heute</div><div id="k205" class="clip cap" data-start="385.470" data-duration="0.940">entsperrt:</div><div id="k206" class="clip cap" data-start="386.570" data-duration="0.480">A,</div><div id="k207" class="clip cap" data-start="387.170" data-duration="1.560">B oder C?</div><div id="k208" class="clip cap" data-start="389.050" data-duration="1.020">Schreib's in die Kommentare.</div><div id="k209" class="clip cap" data-start="390.090" data-duration="1.460">Und sei ehrlich,</div><div id="k210" class="clip cap" data-start="391.810" data-duration="1.320">Otto hat auch C.</div><div id="k211" class="clip cap" data-start="393.250" data-duration="1.680">Aber warum liegst du abends mit dem</div><div id="k212" class="clip cap" data-start="394.950" data-duration="0.960">Handy im Bett,</div><div id="k213" class="clip cap" data-start="396.030" data-duration="1.550">obwohl du eigentlich todmüde</div><div id="k214" class="clip cap" data-start="397.690" data-duration="0.520">bist?</div><div id="k215" class="clip cap" data-start="400.713" data-duration="2.857">Das schauen wir uns nächstes Mal an.</div></div>
