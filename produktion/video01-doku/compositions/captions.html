  <div id="root" data-composition-id="captions" data-width="1920" data-height="1080" data-layout-allow-caption-zone>
    <div id="k0" class="clip cap" data-start="2.770" data-duration="1.340">Das ist Otto.</div><div id="k1" class="clip cap" data-start="4.230" data-duration="2.300">Otto hat heute genau eine Aufgabe.</div><div id="k2" class="clip cap" data-start="6.810" data-duration="1.600">Und Otto wird sie nicht machen.</div><div id="k3" class="clip cap" data-start="11.288" data-duration="2.182">Stattdessen putzt Otto das Bad.</div><div id="k4" class="clip cap" data-start="13.830" data-duration="1.580">Sortiert seine Socken nach Farbe.</div><div id="k5" class="clip cap" data-start="15.430" data-duration="3.740">Und liest zwei Stunden lang über Pinguine.</div><div id="k6" class="clip cap" data-start="19.310" data-duration="1.880">Jetzt würden die meisten sagen:</div><div id="k7" class="clip cap" data-start="21.550" data-duration="1.220">Otto ist faul.</div><div id="k8" class="clip cap" data-start="22.790" data-duration="1.300">Aber faule Menschen</div><div id="k9" class="clip cap" data-start="24.310" data-duration="1.620">sortieren keine Socken.</div><div id="k10" class="clip cap" data-start="26.190" data-duration="1.280">Was mit Otto los ist,</div><div id="k11" class="clip cap" data-start="27.490" data-duration="1.520">und vermutlich auch mit dir,</div><div id="k12" class="clip cap" data-start="29.130" data-duration="1.700">ist etwas völlig anderes.</div><div id="k13" class="clip cap" data-start="31.110" data-duration="2.200">Und wenn du es einmal verstanden hast,</div><div id="k14" class="clip cap" data-start="33.550" data-duration="2.020">schiebst du deutlich weniger auf.</div><div id="k15" class="clip cap" data-start="35.890" data-duration="1.880">Am Ende zeige ich dir einen Trick,</div><div id="k16" class="clip cap" data-start="37.790" data-duration="1.500">der so simpel ist,</div><div id="k17" class="clip cap" data-start="39.530" data-duration="1.600">dass er fast peinlich ist.</div><div id="k18" class="clip cap" data-start="41.170" data-duration="2.540">Aber er ist wissenschaftlich getestet.</div><div id="k19" class="clip cap" data-start="46.787" data-duration="1.923">Fangen wir mit einer Zahl an.</div><div id="k20" class="clip cap" data-start="48.950" data-duration="3.480">Laut einer großen Übersichtsarbeit des Psychologen Piers</div><div id="k21" class="clip cap" data-start="52.450" data-duration="3.120">Steel schieben bis zu 95 Prozent der</div><div id="k22" class="clip cap" data-start="55.590" data-duration="2.800">Studierenden regelmäßig Dinge auf.</div><div id="k23" class="clip cap" data-start="58.490" data-duration="2.240">Und etwa jeder fünfte Erwachsene tut es</div><div id="k24" class="clip cap" data-start="60.750" data-duration="0.900">chronisch.</div><div id="k25" class="clip cap" data-start="61.730" data-duration="1.800">Das sind nicht alles Faulpelze.</div><div id="k26" class="clip cap" data-start="63.690" data-duration="1.600">Das ist einfach menschlich.</div><div id="k27" class="clip cap" data-start="65.370" data-duration="1.520">Der Psychologe Tim Pychyl</div><div id="k28" class="clip cap" data-start="66.910" data-duration="3.400">forscht seit Jahrzehnten zu genau diesem Thema.</div><div id="k29" class="clip cap" data-start="70.490" data-duration="1.680">Gemeinsam mit Fuschia Sirois</div><div id="k30" class="clip cap" data-start="72.190" data-duration="2.320">hat er es auf einen Satz gebracht:</div><div id="k31" class="clip cap" data-start="74.770" data-duration="3.060">Aufschieben ist kein Problem des Zeitmanagements,</div><div id="k32" class="clip cap" data-start="77.930" data-duration="1.920">sondern der Gefühlsregulation.</div><div id="k33" class="clip cap" data-start="80.110" data-duration="1.180">Heißt übersetzt:</div><div id="k34" class="clip cap" data-start="81.470" data-duration="2.440">Otto vermeidet nicht die Steuererklärung.</div><div id="k35" class="clip cap" data-start="83.930" data-duration="1.480">Otto vermeidet das Gefühl,</div><div id="k36" class="clip cap" data-start="85.430" data-duration="3.000">das die Steuererklärung in ihm auslöst.</div><div id="k37" class="clip cap" data-start="88.610" data-duration="0.900">Langeweile.</div><div id="k38" class="clip cap" data-start="89.630" data-duration="1.140">Überforderung.</div><div id="k39" class="clip cap" data-start="90.850" data-duration="0.460">Die Angst,</div><div id="k40" class="clip cap" data-start="91.330" data-duration="1.280">etwas falsch zu machen.</div><div id="k41" class="clip cap" data-start="92.630" data-duration="1.880">Und das Bad putzen?</div><div id="k42" class="clip cap" data-start="94.610" data-duration="1.260">Das fühlt sich gut an.</div><div id="k43" class="clip cap" data-start="95.990" data-duration="1.660">Man sieht sofort ein Ergebnis.</div><div id="k44" class="clip cap" data-start="97.990" data-duration="2.100">Otto flüchtet also nicht vor der Arbeit.</div><div id="k45" class="clip cap" data-start="100.290" data-duration="2.860">Otto flüchtet vor einem schlechten Gefühl.</div><div id="k46" class="clip cap" data-start="104.204" data-duration="1.066">Und jetzt wird's</div><div id="k47" class="clip cap" data-start="105.290" data-duration="0.580">spannend.</div><div id="k48" class="clip cap" data-start="106.170" data-duration="1.800">Denn in Ottos Kopf läuft in diesem</div><div id="k49" class="clip cap" data-start="107.990" data-duration="1.340">Moment ein Kampf,</div><div id="k50" class="clip cap" data-start="109.350" data-duration="2.080">den er praktisch nicht gewinnen kann.</div><div id="k51" class="clip cap" data-start="111.570" data-duration="2.260">In deinem Gehirn sitzt die Amygdala,</div><div id="k52" class="clip cap" data-start="114.030" data-duration="1.840">quasi deine Alarmanlage.</div><div id="k53" class="clip cap" data-start="116.070" data-duration="1.880">Sie reagiert blitzschnell auf alles,</div><div id="k54" class="clip cap" data-start="117.970" data-duration="3.260">was sich unangenehm oder bedrohlich anfühlt.</div><div id="k55" class="clip cap" data-start="121.330" data-duration="2.540">Und dann gibt es den präfrontalen Kortex,</div><div id="k56" class="clip cap" data-start="124.090" data-duration="1.000">den Planer.</div><div id="k57" class="clip cap" data-start="125.110" data-duration="0.620">Der weiß,</div><div id="k58" class="clip cap" data-start="125.750" data-duration="2.460">dass die Steuererklärung bis Freitag fertig sein</div><div id="k59" class="clip cap" data-start="128.230" data-duration="0.520">muss.</div><div id="k60" class="clip cap" data-start="128.890" data-duration="1.300">Forscher der Ruhr-Universität</div><div id="k61" class="clip cap" data-start="130.350" data-duration="4.120">Bochum haben 2018 etwas Spannendes entdeckt.</div><div id="k62" class="clip cap" data-start="134.610" data-duration="0.600">Bei Menschen,</div><div id="k63" class="clip cap" data-start="135.230" data-duration="1.280">die eher dazu neigen,</div><div id="k64" class="clip cap" data-start="136.530" data-duration="1.300">Dinge aufzuschieben,</div><div id="k65" class="clip cap" data-start="137.950" data-duration="1.520">war die Amygdala größer.</div><div id="k66" class="clip cap" data-start="139.490" data-duration="3.100">Und die Verbindung zwischen Alarmanlage und Planer</div><div id="k67" class="clip cap" data-start="142.610" data-duration="1.240">war schwächer.</div><div id="k68" class="clip cap" data-start="143.970" data-duration="0.620">Das heißt:</div><div id="k69" class="clip cap" data-start="144.810" data-duration="1.640">Die Alarmanlage schreit „Gefahr!“,</div><div id="k70" class="clip cap" data-start="146.470" data-duration="2.280">und der Planer kommt mit seinem Klemmbrett</div><div id="k71" class="clip cap" data-start="148.770" data-duration="1.640">einfach nicht dagegen an.</div><div id="k72" class="clip cap" data-start="150.470" data-duration="1.380">Und dann kommt noch dazu:</div><div id="k73" class="clip cap" data-start="152.050" data-duration="1.960">Dein Gehirn liebt Belohnungen,</div><div id="k74" class="clip cap" data-start="154.130" data-duration="1.040">und zwar jetzt.</div><div id="k75" class="clip cap" data-start="155.470" data-duration="2.180">Das Handy belohnt dich in einer Sekunde.</div><div id="k76" class="clip cap" data-start="157.770" data-duration="2.780">Die Steuererklärung belohnt dich irgendwann im Juli,</div><div id="k77" class="clip cap" data-start="160.570" data-duration="2.180">mit einem Bescheid vom Finanzamt.</div><div id="k78" class="clip cap" data-start="162.950" data-duration="0.540">Rate mal,</div><div id="k79" class="clip cap" data-start="163.510" data-duration="0.860">wer gewinnt.</div><div id="k80" class="clip cap" data-start="165.334" data-duration="2.896">Aber der seltsamste Grund kommt erst noch.</div><div id="k81" class="clip cap" data-start="168.390" data-duration="2.380">Denn Otto hat einen Mitbewohner,</div><div id="k82" class="clip cap" data-start="170.790" data-duration="1.220">von dem er nichts weiß.</div><div id="k83" class="clip cap" data-start="172.170" data-duration="0.680">Darf ich vorstellen:</div><div id="k84" class="clip cap" data-start="172.870" data-duration="1.340">Morgen-Otto.</div><div id="k85" class="clip cap" data-start="174.950" data-duration="1.980">Der Psychologe Hal Hershfield</div><div id="k86" class="clip cap" data-start="176.950" data-duration="2.120">hat Menschen im Hirnscanner gebeten,</div><div id="k87" class="clip cap" data-start="179.170" data-duration="1.380">an sich selbst zu denken,</div><div id="k88" class="clip cap" data-start="180.810" data-duration="2.400">an sich selbst in zehn Jahren und</div><div id="k89" class="clip cap" data-start="183.230" data-duration="1.660">an fremde Personen.</div><div id="k90" class="clip cap" data-start="185.090" data-duration="0.800">Das Ergebnis:</div><div id="k91" class="clip cap" data-start="186.350" data-duration="2.420">Wenn wir an unser zukünftiges Ich denken,</div><div id="k92" class="clip cap" data-start="188.790" data-duration="3.240">sieht die Gehirnaktivität eher so aus,</div><div id="k93" class="clip cap" data-start="192.050" data-duration="1.940">als würden wir an einen Fremden denken.</div><div id="k94" class="clip cap" data-start="194.290" data-duration="2.420">Und genau das macht Otto jeden Tag.</div><div id="k95" class="clip cap" data-start="197.050" data-duration="0.980">Er denkt nicht:</div><div id="k96" class="clip cap" data-start="198.230" data-duration="1.300">„Ich mache das morgen.“</div><div id="k97" class="clip cap" data-start="199.690" data-duration="0.780">Er denkt,</div><div id="k98" class="clip cap" data-start="200.530" data-duration="1.300">ohne es zu merken:</div><div id="k99" class="clip cap" data-start="202.050" data-duration="1.940">„Der da macht das morgen.“</div><div id="k100" class="clip cap" data-start="204.090" data-duration="0.520">Das Problem:</div><div id="k101" class="clip cap" data-start="204.630" data-duration="3.000">Morgen-Otto hat genau dieselben Gefühle.</div><div id="k102" class="clip cap" data-start="207.650" data-duration="1.580">Dieselbe Alarmanlage.</div><div id="k103" class="clip cap" data-start="209.250" data-duration="1.540">Dasselbe Handy.</div><div id="k104" class="clip cap" data-start="211.030" data-duration="3.100">Und der schiebt es weiter an Übermorgen-Otto.</div><div id="k105" class="clip cap" data-start="215.201" data-duration="2.409">Jetzt passiert etwas Fieses.</div><div id="k106" class="clip cap" data-start="217.670" data-duration="1.440">Wenn Otto aufschiebt,</div><div id="k107" class="clip cap" data-start="219.250" data-duration="1.360">geht es ihm kurz besser.</div><div id="k108" class="clip cap" data-start="220.890" data-duration="0.920">Erleichterung.</div><div id="k109" class="clip cap" data-start="221.830" data-duration="1.620">Aber ein paar Stunden später kommt das</div><div id="k110" class="clip cap" data-start="223.470" data-duration="1.120">schlechte Gewissen.</div><div id="k111" class="clip cap" data-start="224.710" data-duration="1.300">„Warum bin ich so?</div><div id="k112" class="clip cap" data-start="226.090" data-duration="1.600">Ich krieg nichts auf die Reihe.“</div><div id="k113" class="clip cap" data-start="227.710" data-duration="2.660">Und dieses Schuldgefühl ist ein neues</div><div id="k114" class="clip cap" data-start="230.510" data-duration="1.240">schlechtes Gefühl,</div><div id="k115" class="clip cap" data-start="231.910" data-duration="1.620">das an der Aufgabe klebt.</div><div id="k116" class="clip cap" data-start="233.810" data-duration="1.700">Die Aufgabe fühlt sich also beim nächsten</div><div id="k117" class="clip cap" data-start="235.530" data-duration="2.140">Mal noch schlimmer an.</div><div id="k118" class="clip cap" data-start="237.710" data-duration="2.280">Also schiebt Otto sie noch weiter auf.</div><div id="k119" class="clip cap" data-start="240.190" data-duration="0.880">Merkst du was?</div><div id="k120" class="clip cap" data-start="241.530" data-duration="0.280">Das,</div><div id="k121" class="clip cap" data-start="241.830" data-duration="1.460">was wir normalerweise tun,</div><div id="k122" class="clip cap" data-start="243.310" data-duration="1.800">um uns selbst zu motivieren,</div><div id="k123" class="clip cap" data-start="245.430" data-duration="1.230">also uns fertigmachen,</div><div id="k124" class="clip cap" data-start="246.930" data-duration="1.200">ist genau das,</div><div id="k125" class="clip cap" data-start="248.190" data-duration="2.020">was das Problem schlimmer macht.</div><div id="k126" class="clip cap" data-start="250.410" data-duration="2.120">Und genau hier setzt der Trick an,</div><div id="k127" class="clip cap" data-start="252.590" data-duration="2.120">den ich dir am Anfang versprochen habe.</div><div id="k128" class="clip cap" data-start="255.640" data-duration="0.330">Also.</div><div id="k129" class="clip cap" data-start="255.990" data-duration="1.820">Was hilft wirklich?</div><div id="k130" class="clip cap" data-start="258.030" data-duration="0.980">Werkzeug Nummer eins:</div><div id="k131" class="clip cap" data-start="259.030" data-duration="1.620">Vergib dir selbst.</div><div id="k132" class="clip cap" data-start="260.870" data-duration="1.840">In einer Studie von Michael Wohl,</div><div id="k133" class="clip cap" data-start="262.850" data-duration="2.980">Tim Pychyl und Shannon Bennett wurden Studierende</div><div id="k134" class="clip cap" data-start="265.850" data-duration="1.840">vor zwei Prüfungen begleitet.</div><div id="k135" class="clip cap" data-start="267.910" data-duration="0.760">Diejenigen,</div><div id="k136" class="clip cap" data-start="268.850" data-duration="1.820">die sich nach der ersten Prüfung selbst</div><div id="k137" class="clip cap" data-start="270.690" data-duration="1.200">verziehen hatten,</div><div id="k138" class="clip cap" data-start="272.210" data-duration="2.000">dass sie das Lernen aufgeschoben hatten,</div><div id="k139" class="clip cap" data-start="274.590" data-duration="2.840">schoben vor der zweiten Prüfung weniger auf.</div><div id="k140" class="clip cap" data-start="277.570" data-duration="0.900">Nicht Druck,</div><div id="k141" class="clip cap" data-start="278.630" data-duration="1.380">sondern Nachsicht.</div><div id="k142" class="clip cap" data-start="280.130" data-duration="1.480">Klingt nach Kalenderspruch,</div><div id="k143" class="clip cap" data-start="281.650" data-duration="1.340">ist aber Forschung.</div><div id="k144" class="clip cap" data-start="283.030" data-duration="1.240">Werkzeug Nummer zwei:</div><div id="k145" class="clip cap" data-start="284.390" data-duration="1.240">Benenne das Gefühl.</div><div id="k146" class="clip cap" data-start="285.890" data-duration="0.980">Frag dich ehrlich:</div><div id="k147" class="clip cap" data-start="287.110" data-duration="2.160">Was genau will ich gerade nicht fühlen?</div><div id="k148" class="clip cap" data-start="289.430" data-duration="0.720">Langeweile?</div><div id="k149" class="clip cap" data-start="290.450" data-duration="0.520">Angst?</div><div id="k150" class="clip cap" data-start="291.370" data-duration="0.980">Überforderung?</div><div id="k151" class="clip cap" data-start="292.430" data-duration="0.600">Ein Gefühl,</div><div id="k152" class="clip cap" data-start="293.050" data-duration="1.360">das einen Namen hat,</div><div id="k153" class="clip cap" data-start="294.550" data-duration="1.740">verliert einen Teil seiner Macht.</div><div id="k154" class="clip cap" data-start="296.510" data-duration="1.240">Werkzeug Nummer drei:</div><div id="k155" class="clip cap" data-start="297.950" data-duration="2.440">der lächerlich kleine erste Schritt.</div><div id="k156" class="clip cap" data-start="300.530" data-duration="2.480">Dein Gehirn reagiert auf „Steuererklärung machen“ mit</div><div id="k157" class="clip cap" data-start="303.030" data-duration="0.900">Alarm.</div><div id="k158" class="clip cap" data-start="303.950" data-duration="1.700">Aber auf „Datei öffnen“?</div><div id="k159" class="clip cap" data-start="305.730" data-duration="1.140">Da passiert nichts.</div><div id="k160" class="clip cap" data-start="307.050" data-duration="0.540">Zu klein,</div><div id="k161" class="clip cap" data-start="307.610" data-duration="1.100">um Angst zu machen.</div><div id="k162" class="clip cap" data-start="308.870" data-duration="1.200">Werkzeug Nummer vier:</div><div id="k163" class="clip cap" data-start="310.330" data-duration="1.080">der Zehn-Minuten-Deal.</div><div id="k164" class="clip cap" data-start="311.810" data-duration="1.260">Mach mit dir einen Deal:</div><div id="k165" class="clip cap" data-start="313.230" data-duration="1.100">nur zehn Minuten.</div><div id="k166" class="clip cap" data-start="314.590" data-duration="2.120">Danach darfst du offiziell aufhören.</div><div id="k167" class="clip cap" data-start="316.870" data-duration="0.700">Der Witz:</div><div id="k168" class="clip cap" data-start="317.650" data-duration="1.540">Meistens machst du weiter.</div><div id="k169" class="clip cap" data-start="319.390" data-duration="1.800">Denn das Schlimmste war nie die Arbeit,</div><div id="k170" class="clip cap" data-start="321.350" data-duration="1.680">sondern der Moment davor.</div><div id="k171" class="clip cap" data-start="323.170" data-duration="1.320">Otto ist nicht faul.</div><div id="k172" class="clip cap" data-start="324.530" data-duration="0.860">Du auch nicht.</div><div id="k173" class="clip cap" data-start="325.510" data-duration="1.660">Ihr habt beide nur ein Gehirn,</div><div id="k174" class="clip cap" data-start="327.190" data-duration="2.260">das euch vor schlechten Gefühlen schützen will.</div><div id="k175" class="clip cap" data-start="329.490" data-duration="2.380">Nur leider auf die dümmste mögliche Art.</div><div id="k176" class="clip cap" data-start="334.324" data-duration="1.866">Aber warum Otto dann kurz vor der</div><div id="k177" class="clip cap" data-start="336.210" data-duration="2.900">Deadline plötzlich zu einem Genie wird?</div><div id="k178" class="clip cap" data-start="339.270" data-duration="2.360">Das ist eine ganz andere Geschichte.</div>
  </div>
