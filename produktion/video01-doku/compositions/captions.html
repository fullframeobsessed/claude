  <div id="root" data-composition-id="captions" data-width="1920" data-height="1080" data-layout-allow-caption-zone>
    <div id="k0" class="clip cap" data-start="3.370" data-duration="1.440">Das ist Otto.</div><div id="k1" class="clip cap" data-start="5.210" data-duration="2.160">Otto hat heute genau eine Aufgabe.</div><div id="k2" class="clip cap" data-start="7.390" data-duration="2.340">Und Otto wird sie nicht machen.</div><div id="k3" class="clip cap" data-start="13.339" data-duration="2.411">Stattdessen putzt Otto das Bad.</div><div id="k4" class="clip cap" data-start="16.330" data-duration="1.800">Sortiert seine Socken nach Farbe.</div><div id="k5" class="clip cap" data-start="18.150" data-duration="4.700">Und liest zwei Stunden lang über Pinguine.</div><div id="k6" class="clip cap" data-start="23.149" data-duration="1.941">Jetzt würden die meisten sagen:</div><div id="k7" class="clip cap" data-start="25.490" data-duration="1.300">Otto ist faul.</div><div id="k8" class="clip cap" data-start="27.150" data-duration="3.320">Aber faule Menschen sortieren keine Socken.</div><div id="k9" class="clip cap" data-start="30.765" data-duration="1.565">Was mit Otto los ist,</div><div id="k10" class="clip cap" data-start="32.350" data-duration="2.100">und vermutlich auch mit dir,</div><div id="k11" class="clip cap" data-start="34.930" data-duration="2.100">ist etwas völlig anderes.</div><div id="k12" class="clip cap" data-start="37.770" data-duration="2.580">Und wenn du es einmal verstanden hast,</div><div id="k13" class="clip cap" data-start="40.850" data-duration="2.160">schiebst du deutlich weniger auf.</div><div id="k14" class="clip cap" data-start="43.870" data-duration="1.980">Am Ende zeige ich dir einen Trick,</div><div id="k15" class="clip cap" data-start="46.330" data-duration="1.620">der so simpel ist,</div><div id="k16" class="clip cap" data-start="47.970" data-duration="1.780">dass er fast peinlich ist.</div><div id="k17" class="clip cap" data-start="50.290" data-duration="3.020">Aber er ist wissenschaftlich getestet.</div><div id="k18" class="clip cap" data-start="56.891" data-duration="1.779">Fangen wir mit einer Zahl an.</div><div id="k19" class="clip cap" data-start="59.330" data-duration="3.820">Laut einer großen Übersichtsarbeit des Psychologen Piers</div><div id="k20" class="clip cap" data-start="63.170" data-duration="4.020">Steel schieben bis zu 95 Prozent der</div><div id="k21" class="clip cap" data-start="67.210" data-duration="3.080">Studierenden regelmäßig Dinge auf.</div><div id="k22" class="clip cap" data-start="70.770" data-duration="2.440">Und etwa jeder fünfte Erwachsene tut es</div><div id="k23" class="clip cap" data-start="73.230" data-duration="0.900">chronisch.</div><div id="k24" class="clip cap" data-start="74.650" data-duration="2.080">Das sind nicht alles Faulpelze.</div><div id="k25" class="clip cap" data-start="77.130" data-duration="1.700">Das ist einfach menschlich.</div><div id="k26" class="clip cap" data-start="79.056" data-duration="1.744">Der Psychologe Tim Pychyl</div><div id="k27" class="clip cap" data-start="80.830" data-duration="3.920">forscht seit Jahrzehnten zu genau diesem Thema.</div><div id="k28" class="clip cap" data-start="85.350" data-duration="3.060">Gemeinsam mit Fuschia Sirois hat er es</div><div id="k29" class="clip cap" data-start="88.430" data-duration="1.460">auf einen Satz gebracht:</div><div id="k30" class="clip cap" data-start="90.690" data-duration="4.040">Aufschieben ist kein Problem des Zeitmanagements,</div><div id="k31" class="clip cap" data-start="94.890" data-duration="2.200">sondern der Gefühlsregulation.</div><div id="k32" class="clip cap" data-start="97.472" data-duration="1.098">Heißt übersetzt:</div><div id="k33" class="clip cap" data-start="98.590" data-duration="3.760">Otto vermeidet nicht die Steuererklärung.</div><div id="k34" class="clip cap" data-start="102.910" data-duration="1.520">Otto vermeidet das Gefühl,</div><div id="k35" class="clip cap" data-start="104.450" data-duration="3.000">das die Steuererklärung in ihm auslöst.</div><div id="k36" class="clip cap" data-start="108.010" data-duration="0.900">Langeweile.</div><div id="k37" class="clip cap" data-start="109.730" data-duration="0.940">Überforderung.</div><div id="k38" class="clip cap" data-start="111.290" data-duration="0.540">Die Angst,</div><div id="k39" class="clip cap" data-start="111.850" data-duration="1.900">etwas falsch zu machen.</div><div id="k40" class="clip cap" data-start="114.370" data-duration="1.460">Und das Bad putzen?</div><div id="k41" class="clip cap" data-start="116.310" data-duration="1.400">Das fühlt sich gut an.</div><div id="k42" class="clip cap" data-start="118.250" data-duration="1.720">Man sieht sofort ein Ergebnis.</div><div id="k43" class="clip cap" data-start="120.770" data-duration="2.280">Otto flüchtet also nicht vor der Arbeit.</div><div id="k44" class="clip cap" data-start="123.550" data-duration="2.680">Otto flüchtet vor einem schlechten Gefühl.</div><div id="k45" class="clip cap" data-start="128.208" data-duration="1.362">Und jetzt wird's spannend.</div><div id="k46" class="clip cap" data-start="130.230" data-duration="2.320">Denn in Ottos Kopf läuft in diesem</div><div id="k47" class="clip cap" data-start="132.570" data-duration="1.480">Moment ein Kampf,</div><div id="k48" class="clip cap" data-start="134.290" data-duration="2.340">den er praktisch nicht gewinnen kann.</div><div id="k49" class="clip cap" data-start="136.965" data-duration="2.545">In deinem Gehirn sitzt die Amygdala,</div><div id="k50" class="clip cap" data-start="139.790" data-duration="2.100">quasi deine Alarmanlage.</div><div id="k51" class="clip cap" data-start="142.390" data-duration="2.380">Sie reagiert blitzschnell auf alles,</div><div id="k52" class="clip cap" data-start="144.790" data-duration="3.380">was sich unangenehm oder bedrohlich anfühlt.</div><div id="k53" class="clip cap" data-start="148.690" data-duration="3.340">Und dann gibt es den präfrontalen Kortex,</div><div id="k54" class="clip cap" data-start="152.070" data-duration="1.500">den Planer.</div><div id="k55" class="clip cap" data-start="153.990" data-duration="1.040">Der weiß,</div><div id="k56" class="clip cap" data-start="155.150" data-duration="2.680">dass die Steuererklärung bis Freitag fertig sein</div><div id="k57" class="clip cap" data-start="157.850" data-duration="0.520">muss.</div><div id="k58" class="clip cap" data-start="158.763" data-duration="1.447">Forscher der Ruhr-Universität</div><div id="k59" class="clip cap" data-start="160.410" data-duration="4.460">Bochum haben 2018 etwas Spannendes entdeckt.</div><div id="k60" class="clip cap" data-start="165.270" data-duration="0.680">Bei Menschen,</div><div id="k61" class="clip cap" data-start="165.970" data-duration="1.200">die eher dazu neigen,</div><div id="k62" class="clip cap" data-start="167.190" data-duration="1.360">Dinge aufzuschieben,</div><div id="k63" class="clip cap" data-start="168.830" data-duration="2.220">war die Amygdala größer.</div><div id="k64" class="clip cap" data-start="171.630" data-duration="3.140">Und die Verbindung zwischen Alarmanlage und Planer</div><div id="k65" class="clip cap" data-start="174.790" data-duration="1.260">war schwächer.</div><div id="k66" class="clip cap" data-start="176.230" data-duration="0.760">Das heißt:</div><div id="k67" class="clip cap" data-start="177.450" data-duration="2.460">Die Alarmanlage schreit „Gefahr!“,</div><div id="k68" class="clip cap" data-start="180.120" data-duration="2.370">und der Planer kommt mit seinem Klemmbrett</div><div id="k69" class="clip cap" data-start="182.510" data-duration="2.060">einfach nicht dagegen an.</div><div id="k70" class="clip cap" data-start="184.789" data-duration="1.581">Und dann kommt noch dazu:</div><div id="k71" class="clip cap" data-start="186.710" data-duration="2.420">Dein Gehirn liebt Belohnungen,</div><div id="k72" class="clip cap" data-start="189.310" data-duration="1.060">und zwar jetzt.</div><div id="k73" class="clip cap" data-start="190.910" data-duration="2.380">Das Handy belohnt dich in einer Sekunde.</div><div id="k74" class="clip cap" data-start="193.510" data-duration="3.480">Die Steuererklärung belohnt dich irgendwann im Juli,</div><div id="k75" class="clip cap" data-start="197.010" data-duration="2.220">mit einem Bescheid vom Finanzamt.</div><div id="k76" class="clip cap" data-start="199.830" data-duration="0.820">Rate mal,</div><div id="k77" class="clip cap" data-start="200.670" data-duration="0.760">wer gewinnt.</div><div id="k78" class="clip cap" data-start="203.216" data-duration="2.934">Aber der seltsamste Grund kommt erst noch.</div><div id="k79" class="clip cap" data-start="206.570" data-duration="2.060">Denn Otto hat einen Mitbewohner,</div><div id="k80" class="clip cap" data-start="208.870" data-duration="1.440">von dem er nichts weiß.</div><div id="k81" class="clip cap" data-start="210.910" data-duration="0.940">Darf ich vorstellen:</div><div id="k82" class="clip cap" data-start="211.870" data-duration="1.600">Morgen-Otto.</div><div id="k83" class="clip cap" data-start="214.470" data-duration="1.940">Der Psychologe Hal Hershfield</div><div id="k84" class="clip cap" data-start="216.430" data-duration="2.960">hat Menschen im Hirnscanner gebeten,</div><div id="k85" class="clip cap" data-start="219.530" data-duration="1.520">an sich selbst zu denken,</div><div id="k86" class="clip cap" data-start="221.530" data-duration="1.960">an sich selbst in zehn Jahren</div><div id="k87" class="clip cap" data-start="223.810" data-duration="1.520">und an fremde Personen.</div><div id="k88" class="clip cap" data-start="226.030" data-duration="0.840">Das Ergebnis:</div><div id="k89" class="clip cap" data-start="227.690" data-duration="2.700">Wenn wir an unser zukünftiges Ich denken,</div><div id="k90" class="clip cap" data-start="230.990" data-duration="2.860">sieht die Gehirnaktivität eher so aus,</div><div id="k91" class="clip cap" data-start="234.110" data-duration="2.440">als würden wir an einen Fremden denken.</div><div id="k92" class="clip cap" data-start="236.916" data-duration="2.654">Und genau das macht Otto jeden Tag.</div><div id="k93" class="clip cap" data-start="240.470" data-duration="0.920">Er denkt nicht:</div><div id="k94" class="clip cap" data-start="241.590" data-duration="1.180">„Ich mache das morgen.“</div><div id="k95" class="clip cap" data-start="243.330" data-duration="0.740">Er denkt,</div><div id="k96" class="clip cap" data-start="244.270" data-duration="1.220">ohne es zu merken:</div><div id="k97" class="clip cap" data-start="245.970" data-duration="2.060">„Der da macht das morgen.“</div><div id="k98" class="clip cap" data-start="249.250" data-duration="0.600">Das Problem:</div><div id="k99" class="clip cap" data-start="249.870" data-duration="3.500">Morgen-Otto hat genau dieselben Gefühle.</div><div id="k100" class="clip cap" data-start="253.390" data-duration="2.280">Dieselbe Alarmanlage.</div><div id="k101" class="clip cap" data-start="255.850" data-duration="1.160">Dasselbe Handy.</div><div id="k102" class="clip cap" data-start="257.470" data-duration="3.720">Und der schiebt es weiter an Übermorgen-Otto.</div><div id="k103" class="clip cap" data-start="262.703" data-duration="2.767">Jetzt passiert etwas Fieses.</div><div id="k104" class="clip cap" data-start="265.970" data-duration="1.500">Wenn Otto aufschiebt,</div><div id="k105" class="clip cap" data-start="267.650" data-duration="1.300">geht es ihm kurz besser.</div><div id="k106" class="clip cap" data-start="269.230" data-duration="1.060">Erleichterung.</div><div id="k107" class="clip cap" data-start="270.910" data-duration="1.860">Aber ein paar Stunden später kommt das</div><div id="k108" class="clip cap" data-start="272.790" data-duration="1.160">schlechte Gewissen.</div><div id="k109" class="clip cap" data-start="274.230" data-duration="1.580">„Warum bin ich so?</div><div id="k110" class="clip cap" data-start="276.090" data-duration="1.920">Ich krieg nichts auf die Reihe.“</div><div id="k111" class="clip cap" data-start="278.450" data-duration="3.140">Und dieses Schuldgefühl ist ein neues schlechtes</div><div id="k112" class="clip cap" data-start="281.610" data-duration="0.680">Gefühl,</div><div id="k113" class="clip cap" data-start="282.570" data-duration="1.660">das an der Aufgabe klebt.</div><div id="k114" class="clip cap" data-start="284.910" data-duration="2.260">Die Aufgabe fühlt sich also beim nächsten</div><div id="k115" class="clip cap" data-start="287.190" data-duration="2.160">Mal noch schlimmer an.</div><div id="k116" class="clip cap" data-start="289.710" data-duration="2.820">Also schiebt Otto sie noch weiter auf.</div><div id="k117" class="clip cap" data-start="292.751" data-duration="1.099">Merkst du was?</div><div id="k118" class="clip cap" data-start="294.670" data-duration="0.300">Das,</div><div id="k119" class="clip cap" data-start="294.990" data-duration="1.400">was wir normalerweise tun,</div><div id="k120" class="clip cap" data-start="296.410" data-duration="1.820">um uns selbst zu motivieren,</div><div id="k121" class="clip cap" data-start="298.530" data-duration="1.570">also uns fertigmachen,</div><div id="k122" class="clip cap" data-start="300.610" data-duration="1.140">ist genau das,</div><div id="k123" class="clip cap" data-start="301.990" data-duration="1.860">was das Problem schlimmer macht.</div><div id="k124" class="clip cap" data-start="304.230" data-duration="2.480">Und genau hier setzt der Trick an,</div><div id="k125" class="clip cap" data-start="306.850" data-duration="2.400">den ich dir am Anfang versprochen habe.</div><div id="k126" class="clip cap" data-start="311.108" data-duration="0.642">Also.</div><div id="k127" class="clip cap" data-start="312.450" data-duration="1.680">Was hilft wirklich?</div><div id="k128" class="clip cap" data-start="314.610" data-duration="1.760">Werkzeug Nummer eins:</div><div id="k129" class="clip cap" data-start="317.210" data-duration="1.680">Vergib dir selbst.</div><div id="k130" class="clip cap" data-start="319.790" data-duration="2.280">In einer Studie von Michael Wohl,</div><div id="k131" class="clip cap" data-start="322.330" data-duration="3.600">Tim Pychyl und Shannon Bennett wurden Studierende</div><div id="k132" class="clip cap" data-start="325.950" data-duration="2.120">vor zwei Prüfungen begleitet.</div><div id="k133" class="clip cap" data-start="328.710" data-duration="1.060">Diejenigen,</div><div id="k134" class="clip cap" data-start="329.990" data-duration="2.100">die sich nach der ersten Prüfung selbst</div><div id="k135" class="clip cap" data-start="332.110" data-duration="1.260">verziehen hatten,</div><div id="k136" class="clip cap" data-start="333.750" data-duration="2.120">dass sie das Lernen aufgeschoben hatten,</div><div id="k137" class="clip cap" data-start="336.510" data-duration="3.100">schoben vor der zweiten Prüfung weniger auf.</div><div id="k138" class="clip cap" data-start="340.510" data-duration="1.180">Nicht Druck,</div><div id="k139" class="clip cap" data-start="342.030" data-duration="1.660">sondern Nachsicht.</div><div id="k140" class="clip cap" data-start="344.270" data-duration="1.840">Klingt nach Kalenderspruch,</div><div id="k141" class="clip cap" data-start="346.170" data-duration="1.480">ist aber Forschung.</div><div id="k142" class="clip cap" data-start="347.834" data-duration="1.776">Werkzeug Nummer zwei:</div><div id="k143" class="clip cap" data-start="350.150" data-duration="1.380">Benenne das Gefühl.</div><div id="k144" class="clip cap" data-start="352.190" data-duration="1.380">Frag dich ehrlich:</div><div id="k145" class="clip cap" data-start="354.010" data-duration="2.460">Was genau will ich gerade nicht fühlen?</div><div id="k146" class="clip cap" data-start="356.910" data-duration="0.860">Langeweile?</div><div id="k147" class="clip cap" data-start="358.250" data-duration="0.720">Angst?</div><div id="k148" class="clip cap" data-start="359.770" data-duration="1.100">Überforderung?</div><div id="k149" class="clip cap" data-start="361.650" data-duration="0.680">Ein Gefühl,</div><div id="k150" class="clip cap" data-start="362.350" data-duration="1.220">das einen Namen hat,</div><div id="k151" class="clip cap" data-start="363.590" data-duration="2.040">verliert einen Teil seiner Macht.</div><div id="k152" class="clip cap" data-start="365.884" data-duration="1.766">Werkzeug Nummer drei:</div><div id="k153" class="clip cap" data-start="368.110" data-duration="2.540">der lächerlich kleine erste Schritt.</div><div id="k154" class="clip cap" data-start="371.470" data-duration="3.800">Dein Gehirn reagiert auf „Steuererklärung machen“ mit</div><div id="k155" class="clip cap" data-start="375.290" data-duration="1.240">Alarm.</div><div id="k156" class="clip cap" data-start="377.110" data-duration="1.740">Aber auf „Datei öffnen“?</div><div id="k157" class="clip cap" data-start="379.370" data-duration="1.160">Da passiert nichts.</div><div id="k158" class="clip cap" data-start="381.110" data-duration="0.680">Zu klein,</div><div id="k159" class="clip cap" data-start="381.810" data-duration="1.340">um Angst zu machen.</div><div id="k160" class="clip cap" data-start="383.450" data-duration="1.680">Werkzeug Nummer vier:</div><div id="k161" class="clip cap" data-start="385.710" data-duration="1.380">der Zehn-Minuten-Deal.</div><div id="k162" class="clip cap" data-start="387.790" data-duration="1.460">Mach mit dir einen Deal:</div><div id="k163" class="clip cap" data-start="389.690" data-duration="1.320">nur zehn Minuten.</div><div id="k164" class="clip cap" data-start="391.530" data-duration="2.280">Danach darfst du offiziell aufhören.</div><div id="k165" class="clip cap" data-start="394.310" data-duration="0.820">Der Witz:</div><div id="k166" class="clip cap" data-start="395.550" data-duration="1.960">Meistens machst du weiter.</div><div id="k167" class="clip cap" data-start="398.090" data-duration="2.130">Denn das Schlimmste war nie die Arbeit,</div><div id="k168" class="clip cap" data-start="400.540" data-duration="1.600">sondern der Moment davor.</div><div id="k169" class="clip cap" data-start="402.497" data-duration="1.523">Otto ist nicht faul.</div><div id="k170" class="clip cap" data-start="404.380" data-duration="1.060">Du auch nicht.</div><div id="k171" class="clip cap" data-start="406.040" data-duration="2.320">Ihr habt beide nur ein Gehirn,</div><div id="k172" class="clip cap" data-start="408.460" data-duration="2.980">das euch vor schlechten Gefühlen schützen will.</div><div id="k173" class="clip cap" data-start="412.040" data-duration="4.420">Nur leider auf die dümmste mögliche Art.</div><div id="k174" class="clip cap" data-start="419.374" data-duration="2.266">Aber warum Otto dann kurz vor der</div><div id="k175" class="clip cap" data-start="421.660" data-duration="3.100">Deadline plötzlich zu einem Genie wird?</div><div id="k176" class="clip cap" data-start="424.780" data-duration="3.800">Das ist eine ganz andere Geschichte.</div>
  </div>
