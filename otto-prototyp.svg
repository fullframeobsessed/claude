    <path d="M-45,330 L-52,470" stroke="#1E1E1E" stroke-width="60" fill="none"/>
    <path d="M45,330 L52,470" stroke="#1E1E1E" stroke-width="60" fill="none"/>
    <path d="M-45,330 L-52,470" stroke="#6B7280" stroke-width="48" fill="none"/>
    <path d="M45,330 L52,470" stroke="#6B7280" stroke-width="48" fill="none"/>
