      <path d="M15,9 A22,24 0 0 1 61,9 Z" fill="#F6D2B3"/>
      <path d="M-56,40 Q-38,50 -20,40 M20,40 Q38,50 56,40" fill="none" stroke="#B48A8A" stroke-width="4"/>
