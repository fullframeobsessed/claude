      <ellipse cx="38" cy="8" rx="22" ry="24" fill="#FFFFFF"/>
      <circle cx="-24" cy="10" r="9" fill="#1E1E1E" stroke="none"/>
      <circle cx="52" cy="10" r="9" fill="#1E1E1E" stroke="none"/>
      <path d="M-62,-26 L-16,-34 M16,-34 L62,-26" fill="none"/>
      <path d="M2,22 Q12,42 -4,46" fill="none" stroke-width="5"/>
      <path d="M-30,72 q10,-10 20,0 t20,0 t20,0" fill="none"/>
