  <text x="1300" y="950" text-anchor="middle" font-size="20" font-weight="bold" fill="#1E1E1E">4 · Ausrede</text>
  <text x="1300" y="976" text-anchor="middle" font-size="16" fill="#777">Das Problem</text>

  <!-- ===== Farbpalette ===== -->
  <g transform="translate(60,1020)" font-size="15" fill="#555">
    <text x="0" y="28" font-weight="bold" fill="#1E1E1E" font-size="18">Palette:</text>
    <rect x="100" y="6" width="34" height="34" rx="6" fill="#FF7A1A" stroke="#1E1E1E" stroke-width="3"/><text x="142" y="29">Hoodie #FF7A1A</text>
    <rect x="300" y="6" width="34" height="34" rx="6" fill="#F6D2B3" stroke="#1E1E1E" stroke-width="3"/><text x="342" y="29">Haut #F6D2B3</text>
    <rect x="490" y="6" width="34" height="34" rx="6" fill="#5B3A29" stroke="#1E1E1E" stroke-width="3"/><text x="532" y="29">Haare #5B3A29</text>
    <rect x="690" y="6" width="34" height="34" rx="6" fill="#6B7280" stroke="#1E1E1E" stroke-width="3"/><text x="732" y="29">Hose #6B7280</text>
    <rect x="880" y="6" width="34" height="34" rx="6" fill="#1E1E1E"/><text x="922" y="29">Outline #1E1E1E</text>
    <rect x="1080" y="6" width="34" height="34" rx="6" fill="#FFF8EE" stroke="#1E1E1E" stroke-width="3"/><text x="1122" y="29">Hintergrund #FFF8EE</text>
