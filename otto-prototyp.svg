               C98,-38 84,-55 62,-60 L52,-34 L38,-64 C14,-56 -6,-58 -24,-66 L-36,-38 L-50,-66
               C-76,-60 -96,-38 -108,0 Z"/>
      <path fill="#5B3A29" d="M-28,-128 L-20,-168 L2,-130 Z"/>
