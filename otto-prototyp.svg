  <text x="240" y="80" font-size="28" fill="#555">„Otto Normal" · Charakter-Prototyp v0.1</text>
  <text x="60" y="118" font-size="20" fill="#777">Der Antiheld, der alles auf morgen schiebt. Stil: 2D flat, dicke Outlines, eine Signature-Farbe.</text>

  <!-- ===== HAUPTFIGUR ===== -->
  <g transform="translate(360,380)" stroke="#1E1E1E" stroke-linejoin="round" stroke-linecap="round">
