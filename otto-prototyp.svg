      <ellipse cx="38" cy="8" rx="22" ry="24" fill="#FFFFFF"/>
      <circle cx="-34" cy="14" r="9" fill="#1E1E1E" stroke="none"/>
      <circle cx="42" cy="14" r="9" fill="#1E1E1E" stroke="none"/>
      <path d="M-61,9 A22,24 0 0 1 -15,9 Z" fill="#F6D2B3"/>
      <path d="M15,9 A22,24 0 0 1 61,9 Z" fill="#F6D2B3"/>
