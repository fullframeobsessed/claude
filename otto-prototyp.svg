      <ellipse cx="38" cy="6" rx="23" ry="26" fill="#FFFFFF"/>
      <circle cx="-36" cy="6" r="12" fill="#1E1E1E" stroke="none"/>
      <circle cx="40" cy="6" r="12" fill="#1E1E1E" stroke="none"/>
      <circle cx="-31" cy="1" r="4" fill="#FFFFFF" stroke="none"/>
      <circle cx="45" cy="1" r="4" fill="#FFFFFF" stroke="none"/>
